# Check the external links in the Markdown files with lychee (relative links and anchors are
# docs-check.yml's offline job). Weekly, where a failure fails the run and opens an issue
# (links rot without a change here), and on pull requests that touch Markdown, where it only
# reports: github.com answers checks from Actions with 429 or 503 often enough to fail
# unrelated pull requests even with retries and the token. 429 and 503 are accepted once the
# retries are used up: they say the server is throttling or down, not that the link is broken.

name: docs-links

on:
  pull_request:
    paths: ["**.md", ".github/workflows/docs-links.yml"]
  schedule:
    - cron: "17 7 * * 1"  # weekly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

jobs:
  lychee:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The README's icon uses an absolute raw URL so it renders on package
      # indexes; it points at this repo's own docs/assets/ and is excluded.
      # Excluded: badge images (generated on request; the Scorecard badge doesn't
      # exist before its first run), and tests/corpus/, a verbatim copy of scarletbook-rs's
      # corpus/ directory at v0.3.0 (the sacd-spec conformance corpus; tests/corpus/SOURCE.md),
      # whose README's relative links point into that repository.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress --max-concurrency 4 --max-retries 6 --retry-wait-time 10
            --accept '100..=103,200..=299,429,503'
            --exclude '^https://api\.scorecard\.dev/'
            --exclude '^https://img\.shields\.io/'
            --exclude '^https://raw\.githubusercontent\.com/dsd-toolbox/sacdfs/main/docs/assets/'
            --exclude-path 'tests/corpus/'
            '**/*.md'
          fail: true
          # With the token lychee is throttled less by github.com.
          token: ${{ secrets.GITHUB_TOKEN }}

  report:
    name: weekly report
    needs: lychee
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly external link check failed"
          body="The weekly docs-links run found broken external links: $RUN_URL (the lychee step's output lists them)."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label documentation --label P3 --milestone Docs
          fi
