# Coverage: the whole test suite, FUSE tests included, under cargo-llvm-cov. The report
# goes to the job summary and to Codecov, authenticated with the job's OIDC token (no
# stored secret). Pull requests from forks get no token, so they skip the upload, and an
# upload failure only fails CI on main, so a Codecov outage can't block pull requests.
name: coverage

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov upload with GitHub's OIDC token
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest. See .github/scripts/ci-container-setup.sh. FUSE: the device and the right to mount.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc fuse3 python3 findutils gnupg2 && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE" llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - name: Tests under coverage
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          # A subshell: pipefail would also apply to the `find | head` below (SIGPIPE).
          (set -o pipefail; cargo llvm-cov --locked --no-report 2>&1 | tee "$RUNNER_TEMP/test-output.txt")
          # #127: a process killed while writing its profile leaves a truncated .profraw, and
          # one bad file fails the whole merge. Drop unreadable profiles, with a warning.
          llvm_profdata=$(find "$(rustc --print sysroot)" -name llvm-profdata -type f | head -n1)
          while IFS= read -r -d '' p; do
            if [ ! -s "$p" ] || ! "$llvm_profdata" merge -o /dev/null "$p" 2>/dev/null; then
              echo "::warning::dropping invalid profile $p ($(stat -c %s "$p") bytes)"
              rm -f "$p"
            fi
          done < <(find target/llvm-cov-target -name '*.profraw' -print0)
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo "## Coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Only the expected tests skipped
        run: python3 -I scripts/check_skips.py --job coverage "$RUNNER_TEMP/test-output.txt"
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'push' }}
