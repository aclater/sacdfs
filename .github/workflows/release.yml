# The release (#44). On a version tag (v0.1.0, ...; tags are immutable by ruleset): check
# that the tag matches Cargo.toml and has a CHANGELOG.md section, build and test the Linux
# binaries and the container image, then publish:
#   - a GitHub release with the notes from CHANGELOG.md and three Linux binaries (glibc 2.17+,
#     #244), sacdfs-<version>-x86_64-linux.tar.gz (generic x86-64),
#     sacdfs-<version>-x86_64-v3-linux.tar.gz (x86-64-v3: AVX2 CPUs) and
#     sacdfs-<version>-aarch64-linux.tar.gz, each with COPYING,
#     README.md, CHANGELOG.md, sacdfs-ctl, sacdfs.service, sacdfs.conf.example, install.sh and
#     nas-compose.yaml, a .sha256 checksum and a build provenance attestation;
#   - a static 32-bit x86 binary (#488), sacdfs-<version>-i686-linux.tar.gz, with the same files
#     but install.sh and nas-compose.yaml, a .sha256 checksum and an attestation;
#   - two macOS archives (#420), sacdfs-<version>-aarch64-macos.tar.gz (Apple Silicon) and
#     sacdfs-<version>-x86_64-macos.tar.gz (Intel), each with sacdfs-nfs (the mount, over the
#     Mac's own NFS client), sacdfs (verify and tags), COPYING, README.md, CHANGELOG.md and
#     NFSSERVE-LICENSE (the vendored NFS layer's BSD-3-Clause notice), with a .sha256 checksum
#     and an attestation. From 0.8.0 both programs are signed with a Developer ID (hardened
#     runtime, secure timestamp) and notarised by Apple (job "macos-sign", on a tag only, in the
#     environment "release"; before 0.8.0 they were not). Built and tested unsigned on every
#     run (named -unsigned, never published), and published only when the repository variable
#     SACDFS_MACOS_RELEASE is "true" (#420). The archives of an earlier tag's run can be added to its release by hand
#     (job "macos-publish", below);
#   - the installer, install.sh (#340), with this version as its default and the SHA-256 of
#     this release's archives built in (it checks downloads against those), also as an asset
#     of its own with a .sha256 checksum and an attestation, so that
#     releases/latest/download/install.sh is the newest release's. It is packed after the
#     binaries are built (job "installer"); the copy inside each archive has the version and
#     the SHA-256 of that archive's release files. install.sh verifies release files beside it
#     against built-in checksums (.github/scripts/stamp-members.sh): the one published on its
#     own carries every archive's;
#   - the Windows front end (#419), sacdfs-<version>-x86_64-windows.zip: sacdfs-win.exe (static C
#     runtime; needs WinFsp installed), COPYING, CHANGELOG.md and the Windows install guide as
#     README.md, with a .sha256 checksum and an attestation, after the packed program served the
#     corpus with the Linux binary's bytes (job "windows"). The repository variable
#     WINDOWS_SIGNING says whether sacdfs-win.exe is code-signed: "off" (until the certificate
#     is in place) publishes it unsigned, "required" signs it through SSL.com eSigner (job
#     "windows-sign", on a tag only, in the environment "release") and fails closed without
#     the secrets; any other value stops a tag's run in preflight;
#   - Linux packages (#460), packed with nfpm from the x86_64 and aarch64 archives' files (the
#     same binaries, not rebuilt; packaging/): sacdfs-<version>-1.<x86_64|aarch64>.rpm and
#     sacdfs_<version>-1_<amd64|arm64>.deb, each with a .sha256 and an attestation, after each
#     passed packaging/test-packages.sh in containers of the distributions they are for (job
#     "packages-test"); and the source RPM for COPR, sacdfs-<version>-1.src.rpm (the tag's
#     source, its vendored crates and packaging/sacdfs.spec), after it rebuilt offline on UBI 9,
#     UBI 10 and Fedora (job "srpm-test");
#   - the container image, ghcr.io/aclater/sacdfs:<version> and :latest, a multi-arch manifest
#     (amd64 and arm64, #43), attested, after the container share test passed on each very image.
#   - the crate on crates.io (#155), for final versions only (no hyphen: not 0.4.0-rc.1),
#     through crates.io trusted publishing (no token stored here). A version already on
#     crates.io is skipped, so the first one, published by hand, doesn't fail the release.
#
# Dry run: run by hand (workflow_dispatch), or on a pull request that changes the release's
# files, it builds and tests everything and publishes nothing. Every job or step that
# publishes is guarded by `github.ref_type == 'tag'`, and only a tag push makes that true.
#
# macOS archives of an earlier release (job "macos-publish"): run by hand on main with
# `macos_run` (the tag's release run) and `tag`. It builds nothing: it takes that run's mac-*
# artifacts, checks their checksums, attests them, adds them with their .sha256 and
# .intoto.jsonl to the existing release, appends their lines to SHA256SUMS and adds the
# macOS lines to the notes. The tag and the other assets are not touched.
#
# Linux packages of an earlier release (#460): run by hand on main with `packages_tag`. It
# builds no binary: it packs that release's published x86_64 and aarch64 archives (after
# checking their checksums and attestations) and its tag's source, runs the same tests, attests
# the packages and the source RPM, adds them with their .sha256 and .intoto.jsonl to the
# existing release, appends their lines to SHA256SUMS and adds their lines to the notes. The
# tag and the other assets are not touched (job "packages-publish").
#
# The release checklist is in CONTRIBUTING.md, "Releasing".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos_run:
        description: "Publish only: the tag's release run whose macOS archives go on its release (empty: dry run)"
        required: false
        default: ""
      tag:
        description: "With macos_run: the release's tag, e.g. v0.6.5"
        required: false
        default: ""
      packages_tag:
        description: "Publish only: an existing release's tag (e.g. v0.6.5) to add Linux packages to (empty: dry run)"
        required: false
        default: ""
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - ".github/scripts/**"
      - "Containerfile"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "winfsp/**"
      - "docs/install/windows.md"

permissions:
  contents: read

# One release per tag at a time; a second run for the same ref waits instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  IMAGE: ghcr.io/aclater/sacdfs

defaults:
  run:
    shell: bash

jobs:
  # Cheap checks first: a tag that doesn't match the version, or has no CHANGELOG.md section,
  # stops the release before anything is built.
  preflight:
    name: version and notes
    # Not when adding an earlier run's macOS archives or an earlier release's packages:
    # then nothing is built.
    if: inputs.macos_run == '' && inputs.packages_tag == ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml's version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -I -c '
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])')
          locked=$(python3 -I -c '
          import tomllib
          with open("Cargo.lock", "rb") as f:
              print(next(p["version"] for p in tomllib.load(f)["package"] if p["name"] == "sacdfs"))')
          if [[ "$locked" != "$version" ]]; then
            echo "::error::Cargo.lock has sacdfs $locked, Cargo.toml $version"
            exit 1
          fi
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ "$REF_NAME" != "v$version" ]]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml's version $version (expected v$version)"
              exit 1
            fi
          else
            echo "::notice::dry run of sacdfs $version from $REF_NAME: nothing will be published"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A tag publishes only a commit that is on main or on a release/X.Y.Z branch (a patch
      # release cut from an earlier tag), never one from a pull request's branch or one never
      # pushed to a branch. The script fetches those branches' history first.
      - name: The tag's commit is on main or a release/* branch
        if: github.ref_type == 'tag'
        env:
          TAG_SHA: ${{ github.sha }}
        run: sh .github/scripts/check-tag-reachable.sh "$TAG_SHA"
      # Windows code signing is either deliberately off or required; nothing in between.
      - name: WINDOWS_SIGNING is off or required
        if: github.ref_type == 'tag'
        env:
          WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
        run: |
          case "$WINDOWS_SIGNING" in
            required) echo "Windows: sacdfs-win.exe is signed (job windows-sign)" ;;
            off) echo "::warning::WINDOWS_SIGNING is off: the Windows zip is published unsigned" ;;
            *) echo "::error::the repository variable WINDOWS_SIGNING must be off or required, not '$WINDOWS_SIGNING'"; exit 1 ;;
          esac
      - name: Release notes from CHANGELOG.md
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dry=()
          [[ "$REF_TYPE" == tag ]] || dry=(--dry-run)
          python3 -I .github/scripts/changelog-notes.py CHANGELOG.md "$VERSION" "${dry[@]}" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 7

  # Linux binaries linked against glibc 2.17's symbols (#244), so that they run on RHEL 7 era
  # systems and on NAS systems with an old glibc (QNAP's QuTScloud 5.2.9 has 2.21), with
  # glibc's malloc and the binary's speed unchanged. Built with cargo-zigbuild: zig links
  # against the symbol versions of the glibc named in the target (x86_64-unknown-linux-gnu.2.17),
  # whatever the build system's glibc. zig and cargo-zigbuild are pinned to exact versions,
  # the zig archive by its SHA-256. Rust's own std supports glibc 2.17 and later. Not static
  # musl: measured, musl's malloc made reads 1.25 to 2.6 times slower, and the faster
  # allocators cost speed on plain DSD discs (jemalloc) or 3.5 to 4.6 times the peak memory
  # (mimalloc) (docs/design.md, "Release binaries"). Rust comes from rustup, the toolchain the
  # rest of CI tests with. Each build is tested on its native runner (the whole test suite,
  # FUSE included, linked the same way), checked for its newest glibc symbol, then the
  # packaged binary is checked on the corpus on the runner and, on x86_64, in a UBI 7
  # container (RHEL 7's glibc 2.17, no fusermount: as root, sacdfs mounts directly), which
  # must serve the same bytes.
  binaries:
    name: binary (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # target-cpu is always set on x86_64, never left to a toolchain's default.
          - {name: x86_64, arch: x86_64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64",
             zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00}
          - {name: x86_64-v3, arch: x86_64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3",
             zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00}
          - {name: aarch64, arch: aarch64, runner: ubuntu-24.04-arm, rustflags: "",
             zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      NAME: ${{ matrix.name }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      GLIBC_MAX: "2.17"
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
      CARGO_ZIGBUILD_VERSION: 0.24.0
      MATRIX_RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # registry.access.redhat.com/ubi7/ubi, pinned by digest: glibc 2.17 (x86_64 only).
      UBI7: registry.access.redhat.com/ubi7/ubi@sha256:046e525722f14702c360dc6092324af7c21656e76b0c254b067871f1d4d3df68
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The runner can run an x86-64-v3 build
        if: matrix.name == 'x86_64-v3'
        run: |
          # The v3 binary is published only if it passed its tests on this runner.
          for f in avx2 bmi1 bmi2 fma movbe; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::runner CPU has no $f: the x86-64-v3 build cannot be tested"; exit 1; }
          done
      - name: Rust, zig, cargo-zigbuild and fusermount3
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal --target "$TARGET"
          rustup default "$RUST_STABLE"
          zig="zig-$ARCH-linux-$ZIG_VERSION"
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/$zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
          # The runner's paths are left out of the binary.
          echo "RUSTFLAGS=$MATRIX_RUSTFLAGS --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/sacdfs" >> "$GITHUB_ENV"
      - name: Build and test, linked against glibc 2.17 (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          zig version
          cargo zigbuild --release --locked --bin sacdfs --target "$TARGET.$GLIBC_MAX"
          cargo-zigbuild test --release --locked --target "$TARGET.$GLIBC_MAX"
      - name: glibc 2.17 or later, stripped
        run: |
          bin="target/$TARGET/release/sacdfs"
          file "$bin"
          readelf -d "$bin" | grep NEEDED
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $max"
          if [[ "$(printf '%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -n 1)" != "$GLIBC_MAX" ]]; then
            echo "::error::the binary needs glibc $max, newer than $GLIBC_MAX"; exit 1
          fi
          if readelf -S "$bin" | grep -q '\.symtab'; then
            echo "::error::the binary is not stripped"; exit 1
          fi
      - name: Package
        run: |
          pkg="sacdfs-$VERSION-$NAME-linux"
          mkdir -p "dist/$pkg"
          install -m 0755 "target/$TARGET/release/sacdfs" "dist/$pkg/sacdfs"
          install -m 0644 COPYING README.md CHANGELOG.md "dist/$pkg/"
          # The files for starting and stopping sacdfs on a NAS (#289): the script for systems
          # without systemd, the systemd unit and the settings file both read.
          install -m 0755 deploy/sacdfs-ctl "dist/$pkg/"
          install -m 0644 deploy/systemd/sacdfs.service deploy/sacdfs.conf.example "dist/$pkg/"
          # The installer (#340), stamped with this version, and the Compose file it uses.
          sed "s/^DEFAULT_VERSION=[^ ]*/DEFAULT_VERSION=$VERSION/" deploy/install.sh > "dist/$pkg/install.sh"
          chmod 0755 "dist/$pkg/install.sh"
          # The Compose file names this release's image, or the container route would run whatever
          # version main's copy names (0.6.2-rc.1 shipped one naming 0.6.1).
          sed "s#ghcr.io/aclater/sacdfs:[^ ]*\$#ghcr.io/aclater/sacdfs:$VERSION#" deploy/nas-compose.yaml > "dist/$pkg/nas-compose.yaml"
          grep -q "image: ghcr.io/aclater/sacdfs:$VERSION\$" "dist/$pkg/nas-compose.yaml"
          chmod 0644 "dist/$pkg/nas-compose.yaml"
          # install.sh verifies release files beside it against built-in checksums: this
          # archive's, from the exact files packed. Last before packing, so nothing changes them.
          sh .github/scripts/stamp-members.sh fill "dist/$pkg/install.sh" "dist/$pkg"
          # Reproducible: fixed order, owner and times (the commit's), no gzip timestamp.
          mtime=$(git log -1 --format=%ct)
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -cf - "$pkg" | gzip -n -9 > "dist/$pkg.tar.gz"
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256" && cat "$pkg.tar.gz.sha256")
          # The finished archive, unpacked: its release files match the checksums in its own
          # install.sh.
          sh .github/scripts/stamp-members.sh check "dist/$pkg.tar.gz"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: The packaged binary serves the corpus
        run: |
          mkdir -p /tmp/check /tmp/mnt
          tar -C /tmp/check -xzf "dist/$PKG.tar.gz"
          bin="/tmp/check/$PKG/sacdfs"
          "$bin" --version
          "$bin" tests/corpus/images /tmp/mnt 2> /tmp/serve.log
          status=0
          python3 -I deploy/check-share.py tests/corpus/manifest.json /tmp/mnt --min 400 --wav || status=$?
          (cd /tmp/mnt && find . -type f | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /tmp/host.sha256
          fusermount3 -u /tmp/mnt
          exit $status
      - name: The same bytes on glibc 2.17, mounted without fusermount (UBI 7)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -v "/tmp/check/$PKG:/d:ro" -v "$PWD/tests/corpus/images:/images:ro" -v /tmp:/out \
            "$UBI7" bash -euc '
              rpm -q glibc
              if command -v fusermount3 || command -v fusermount; then echo "this image has fusermount: the mount below would not show that sacdfs mounts without it"; exit 1; fi
              /d/sacdfs --version
              mkdir -p /mnt/s
              /d/sacdfs /images /mnt/s 2> /out/ubi7.log
              (cd /mnt/s && find . -type f | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /out/ubi7.sha256
              umount /mnt/s'
          wc -l /tmp/host.sha256 /tmp/ubi7.sha256
          cmp /tmp/host.sha256 /tmp/ubi7.sha256
      # The Windows binary is checked against these bytes (job "windows").
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.name == 'x86_64'
        with:
          name: corpus-sha256
          path: /tmp/host.sha256
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bin-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # 32-bit x86 (#488), for 32-bit NAS units such as Atom-based ones: a static
  # i686-unknown-linux-musl binary for Pentium 4 and later (SSE2 at most), so it needs no C
  # library on the system (docs/design.md, "Release binaries and image"). Same zig and
  # cargo-zigbuild as above. The x86_64 runner runs it natively: the whole test suite (FUSE
  # included), then the packaged binary must serve the corpus with the x86_64 build's bytes.
  # No install.sh or nas-compose.yaml in its archive: the installer stops on 32-bit systems and
  # the image has no 32-bit build.
  binary-i686:
    name: binary (i686)
    needs: [preflight, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TARGET: i686-unknown-linux-musl
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_ZIGBUILD_VERSION: 0.24.0
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust, zig, cargo-zigbuild and fusermount3
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal --target "$TARGET"
          rustup default "$RUST_STABLE"
          zig="zig-x86_64-linux-$ZIG_VERSION"
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/$zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
          # The runner's paths are left out of the binary.
          echo "RUSTFLAGS=-C target-cpu=pentium4 -C target-feature=+crt-static --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/sacdfs" >> "$GITHUB_ENV"
      - name: Build and test, static (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          zig version
          cargo zigbuild --release --locked --bin sacdfs --target "$TARGET"
          cargo-zigbuild test --release --locked --target "$TARGET"
      - name: Static 32-bit, stripped
        run: |
          bin="target/$TARGET/release/sacdfs"
          file "$bin"
          file "$bin" | grep -q 'ELF 32-bit LSB executable, Intel'
          if readelf -l "$bin" | grep -q INTERP || readelf -d "$bin" | grep -q NEEDED; then
            echo "::error::the binary is not static"; exit 1
          fi
          if readelf -S "$bin" | grep -q '\.symtab'; then
            echo "::error::the binary is not stripped"; exit 1
          fi
      - name: Package
        run: |
          pkg="sacdfs-$VERSION-i686-linux"
          mkdir -p "dist/$pkg"
          install -m 0755 "target/$TARGET/release/sacdfs" "dist/$pkg/sacdfs"
          install -m 0644 COPYING README.md CHANGELOG.md "dist/$pkg/"
          install -m 0755 deploy/sacdfs-ctl "dist/$pkg/"
          install -m 0644 deploy/systemd/sacdfs.service deploy/sacdfs.conf.example "dist/$pkg/"
          # Reproducible: fixed order, owner and times (the commit's), no gzip timestamp.
          mtime=$(git log -1 --format=%ct)
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -cf - "$pkg" | gzip -n -9 > "dist/$pkg.tar.gz"
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256" && cat "$pkg.tar.gz.sha256")
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: corpus-sha256
          path: ${{ runner.temp }}/x86_64
      - name: The packaged binary serves the corpus with the x86_64 build's bytes
        run: |
          mkdir -p /tmp/check /tmp/mnt
          tar -C /tmp/check -xzf "dist/$PKG.tar.gz"
          bin="/tmp/check/$PKG/sacdfs"
          "$bin" --version
          "$bin" tests/corpus/images /tmp/mnt 2> /tmp/serve.log
          status=0
          python3 -I deploy/check-share.py tests/corpus/manifest.json /tmp/mnt --min 400 --wav || status=$?
          (cd /tmp/mnt && find . -type f | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /tmp/i686.sha256
          fusermount3 -u /tmp/mnt
          [[ $status == 0 ]] || exit $status
          wc -l "$RUNNER_TEMP/x86_64/host.sha256" /tmp/i686.sha256
          cmp "$RUNNER_TEMP/x86_64/host.sha256" /tmp/i686.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bin-i686
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # macOS (#420): built and tested on the matching runner, then the packaged sacdfs-nfs
  # mounts the corpus with the Mac's own NFS client (tests/macos-nfs.sh).
  macos:
    name: binary (${{ matrix.name }}-macos)
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: aarch64, runner: macos-latest}
          - {name: x86_64, runner: macos-15-intel}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      NAME: ${{ matrix.name }}
      # The oldest macOS the binaries start on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal
          rustup default "$RUST_STABLE"
          sw_vers
          uname -m
          # The runner's paths are left out of the binary.
          echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/sacdfs" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          cargo build --release --locked --features nfs --bins
          cargo test --release --locked --features nfs
      # Unsigned, and named so: only job "macos-sign" makes the archives a release publishes.
      - name: Package (unsigned)
        run: |
          pkg="sacdfs-$VERSION-$NAME-macos-unsigned"
          mkdir -p "dist/$pkg"
          install -m 0755 target/release/sacdfs-nfs target/release/sacdfs "dist/$pkg/"
          install -m 0644 COPYING README.md CHANGELOG.md "dist/$pkg/"
          # The vendored NFS layer's licence asks for its notice with binaries.
          install -m 0644 src/nfs/proto/LICENSE "dist/$pkg/NFSSERVE-LICENSE"
          lipo -archs "dist/$pkg/sacdfs-nfs"
          otool -L "dist/$pkg/sacdfs-nfs"
          .github/scripts/pack-macos.sh dist "$pkg"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: The packaged sacdfs-nfs mounts the corpus as this user
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          tar -C "$RUNNER_TEMP/check" -xzf "dist/$PKG.tar.gz"
          "$RUNNER_TEMP/check/$PKG/sacdfs-nfs" --version
          "$RUNNER_TEMP/check/$PKG/sacdfs" verify --help > /dev/null
          tests/macos-nfs.sh "$RUNNER_TEMP/check/$PKG/sacdfs-nfs" macos.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-mac-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # Developer ID signing and notarisation of the macOS programs (from 0.8.0), on a tag only:
  # the environment "release" holds the six MACOS_* secrets (the Developer ID Application
  # certificate and its identity, and an App Store Connect API key for notarytool), allows only
  # v* tags and waits for its reviewer, so it is the one job of a release run that pauses. It
  # fails closed: without every secret it stops, and the release (which needs it) publishes
  # nothing. It takes job "macos"'s unsigned archive (already tested), signs each Mach-O in it
  # with the hardened runtime and a secure timestamp, has Apple notarise them (the verdict must
  # be Accepted, and each program must then verify as notarised), packs the archive the
  # release publishes as mac-<arch>, and runs the same mount test on it. A bare program can't
  # carry the notarisation ticket (no stapling), so Gatekeeper checks it online on first run.
  macos-sign:
    name: sign and notarise (${{ matrix.name }}-macos)
    if: github.ref_type == 'tag'
    needs: [preflight, macos]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: aarch64, runner: macos-latest}
          - {name: x86_64, runner: macos-15-intel}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      NAME: ${{ matrix.name }}
      HAS_SIGNING: >-
        ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != ''
        && secrets.MACOS_SIGN_IDENTITY != '' && secrets.MACOS_NOTARY_KEY_ID != ''
        && secrets.MACOS_NOTARY_ISSUER != '' && secrets.MACOS_NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - name: Fail closed without the signing secrets
        run: |
          [[ "$HAS_SIGNING" == true ]] \
            || { echo "::error::a MACOS_* signing or notary secret is missing in the environment release; nothing is signed or published"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: unsigned-mac-${{ matrix.name }}
          path: unsigned
      - name: Unpack the tested unsigned archive
        run: |
          (cd unsigned && shasum -a 256 -c ./*.sha256)
          pkg="sacdfs-$VERSION-$NAME-macos"
          mkdir -p dist
          tar -C dist -xzf "unsigned/$pkg-unsigned.tar.gz"
          mv "dist/$pkg-unsigned" "dist/$pkg"
          # Every Mach-O in the archive is signed; there must be the two programs.
          : > "$RUNNER_TEMP/macho.txt"
          find "dist/$pkg" -type f | LC_ALL=C sort | while read -r f; do
            if file -b "$f" | grep -q '^Mach-O'; then echo "$f" >> "$RUNNER_TEMP/macho.txt"; fi
          done
          cat "$RUNNER_TEMP/macho.txt"
          [[ "$(xargs -n1 basename < "$RUNNER_TEMP/macho.txt" | LC_ALL=C sort | tr '\n' ' ')" == "sacdfs sacdfs-nfs " ]] \
            || { echo "::error::unexpected Mach-O files"; exit 1; }
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Temporary keychain with the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(uuidgen)
          echo "::add-mask::$kcpw"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          (umask 077 && base64 --decode <<< "$MACOS_CERT_P12_BASE64" > "$RUNNER_TEMP/cert.p12")
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" "$HOME/Library/Keychains/login.keychain-db"
          [[ $(security find-identity -v -p codesigning "$kc" | grep -c 'Developer ID Application') -ge 1 ]] \
            || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
      - name: Sign (hardened runtime, secure timestamp)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          while read -r f; do
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
              --sign "$MACOS_SIGN_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
            info=$(codesign -d --verbose=2 "$f" 2>&1)
            grep -E '^(Identifier|Format|CodeDirectory|Authority|TeamIdentifier|Timestamp|Runtime Version)' <<< "$info"
            grep -q 'flags=0x10000(runtime)' <<< "$info" \
              || { echo "::error::$f is not signed with the hardened runtime"; exit 1; }
            grep -q '^Timestamp=' <<< "$info" \
              || { echo "::error::$f has no secure timestamp"; exit 1; }
          done < "$RUNNER_TEMP/macho.txt"
      - name: Notarise
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          (umask 077 && base64 --decode <<< "$MACOS_NOTARY_KEY_P8_BASE64" > "$key")
          trap 'rm -f "$key"' EXIT
          auth=(--key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER")
          ditto -c -k --keepParent "dist/$PKG" "$RUNNER_TEMP/notarise.zip"
          rc=0
          out=$(xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" "${auth[@]}" \
            --wait --timeout 40m --output-format json) || rc=$?
          echo "$out"
          [[ -n "$out" ]] || { echo "::error::notarytool submit failed ($rc)"; exit 1; }
          id=$(plutil -extract id raw -o - - <<< "$out")
          status=$(plutil -extract status raw -o - - <<< "$out")
          xcrun notarytool log "$id" "${auth[@]}" || true
          [[ "$status" == Accepted ]] || { echo "::error::notarisation $id: $status, not Accepted"; exit 1; }
      # Don't trust --wait alone: the programs users download must verify as notarised, which
      # asks Apple for the ticket online (a few tries: it may lag the verdict).
      - name: Each program verifies as notarised
        run: |
          while read -r f; do
            for try in 1 2 3 4 5 6; do
              codesign --verify --strict --check-notarization -R='notarized' --verbose=2 "$f" && break
              [[ $try == 6 ]] && { echo "::error::$f doesn't verify as notarised"; exit 1; }
              sleep 20
            done
          done < "$RUNNER_TEMP/macho.txt"
      - name: Package (signed)
        run: .github/scripts/pack-macos.sh dist "$PKG"
      - name: The signed sacdfs-nfs mounts the corpus as this user
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          tar -C "$RUNNER_TEMP/check" -xzf "dist/$PKG.tar.gz"
          for f in sacdfs-nfs sacdfs; do
            codesign --verify --strict --verbose=2 "$RUNNER_TEMP/check/$PKG/$f"
          done
          "$RUNNER_TEMP/check/$PKG/sacdfs-nfs" --version
          "$RUNNER_TEMP/check/$PKG/sacdfs" verify --help > /dev/null
          tests/macos-nfs.sh "$RUNNER_TEMP/check/$PKG/sacdfs-nfs" macos.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mac-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Remove the temporary keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" && -e "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
          fi
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/notarise.zip"

  # The Windows front end (winfsp/, #419): built on the Windows runner with the C runtime linked
  # in (no Visual C++ redistributable needed), packed as a zip with COPYING, CHANGELOG.md and
  # its README (which carries WinFsp's notice), then the packed program is mounted on the corpus
  # and checked against the generic Linux binary's hashes (winfsp/ci/checks.ps1). WinFsp itself
  # is not in the zip: users install WinFsp's own signed MSI.
  windows:
    name: binary (x86_64-windows)
    needs: [preflight, binaries]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # WinFsp 2.1 (2.1.25156), for the check only.
      WINFSP_MSI: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
      WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install $env:RUST_STABLE --profile minimal
          rustup default $env:RUST_STABLE
      - name: WinFsp (MSI, checked against its SHA-256)
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          Invoke-WebRequest $env:WINFSP_MSI -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:WINFSP_SHA256) { throw "WinFsp MSI: SHA-256 differs" }
          $p = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec: $($p.ExitCode)" }
      - name: Build (release, C runtime linked in)
        working-directory: winfsp
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked
          $v = (& target\release\sacdfs-win.exe --version) -join " "
          if (-not $v.Contains("sacdfs-win $env:VERSION")) { throw "--version: $v" }
          # No Visual C++ runtime DLL among its imports.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = (& $dumpbin /nologo /dependents target\release\sacdfs-win.exe) -join "`n"
          $deps
          if ($deps -match "(?i)vcruntime|msvcp|api-ms-win-crt") { throw "depends on the Visual C++ runtime" }
      - name: Package
        run: |
          $pkg = "sacdfs-$env:VERSION-x86_64-windows"
          python -I .github/scripts/pack-windows.py $pkg winfsp/target/release/sacdfs-win.exe COPYING CHANGELOG.md docs/install/windows.md=README.md
          "PKG=$pkg" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: corpus-sha256
          path: ${{ runner.temp }}
      - name: The packed program serves the corpus as on Linux (winfsp/ci/checks.ps1)
        shell: powershell
        run: |
          Expand-Archive "dist\$env:PKG.zip" "$env:RUNNER_TEMP\check"
          winfsp\ci\checks.ps1 -Exe "$env:RUNNER_TEMP\check\sacdfs-win.exe" -Source tests\corpus\images `
            -Mount X: -Reference (Join-Path $env:RUNNER_TEMP "host.sha256") -Work $env:RUNNER_TEMP
      # Unsigned: the release takes this one only while WINDOWS_SIGNING is off.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: win-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # Authenticode signing of sacdfs-win.exe through SSL.com eSigner (cloud signing; the key never
  # leaves SSL.com), on a tag only and only when the repository variable WINDOWS_SIGNING is
  # "required". The environment "release" holds ES_USERNAME, ES_PASSWORD, ES_CREDENTIAL_ID and
  # ES_TOTP_SECRET, allows only v* tags and waits for its reviewer. It fails closed: without
  # every secret, or if the signature doesn't verify with a timestamp, it stops and the release
  # publishes nothing. CodeSignTool is SSL.com's release from GitHub, checked against its
  # SHA-256. It takes job "windows"'s tested zip, signs the program, packs the zip again the
  # same way and runs the same corpus check on the signed program.
  windows-sign:
    name: sign (x86_64-windows)
    if: github.ref_type == 'tag' && vars.WINDOWS_SIGNING == 'required'
    needs: [preflight, binaries, windows]
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      HAS_SIGNING: >-
        ${{ secrets.ES_USERNAME != '' && secrets.ES_PASSWORD != ''
        && secrets.ES_CREDENTIAL_ID != '' && secrets.ES_TOTP_SECRET != '' }}
      # SSL.com CodeSignTool 1.3.2 for Windows (with its own Java runtime).
      CST_ZIP: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
      CST_SHA256: 4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b
      # WinFsp 2.1 (2.1.25156), for the check only (as in job "windows").
      WINFSP_MSI: https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi
      WINFSP_SHA256: 073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fail closed without the signing secrets
        run: |
          if ($env:HAS_SIGNING -ne 'true') {
            Write-Output "::error::an ES_* eSigner secret is missing in the environment release; nothing is signed or published"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: win-unsigned
          path: unsigned
      - name: Unpack the tested unsigned zip
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "sacdfs-$env:VERSION-x86_64-windows"
          $want = (Get-Content "unsigned\$pkg.zip.sha256").Split(" ")[0]
          if ((Get-FileHash "unsigned\$pkg.zip" -Algorithm SHA256).Hash -ne $want) { throw "unsigned zip: SHA-256 differs" }
          Expand-Archive "unsigned\$pkg.zip" "$env:RUNNER_TEMP\unsigned"
          "PKG=$pkg" >> $env:GITHUB_ENV
      - name: CodeSignTool (checked against its SHA-256)
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "codesigntool.zip"
          Invoke-WebRequest $env:CST_ZIP -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:CST_SHA256) { throw "CodeSignTool: SHA-256 differs" }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP "codesigntool")
      - name: Sign sacdfs-win.exe (eSigner)
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"; $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "signed"
          New-Item -ItemType Directory $out | Out-Null
          Set-Location (Join-Path $env:RUNNER_TEMP "codesigntool")
          & .\jdk-11.0.2\bin\java.exe -jar .\jar\code_sign_tool-1.3.2.jar sign `
            "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" `
            "-credential_id=$env:ES_CREDENTIAL_ID" "-totp_secret=$env:ES_TOTP_SECRET" `
            "-input_file_path=$env:RUNNER_TEMP\unsigned\sacdfs-win.exe" "-output_dir_path=$out"
      # CodeSignTool may exit 0 on an error: the signature itself is what counts.
      - name: The signature verifies, with a timestamp
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "signed\sacdfs-win.exe"
          $sig = Get-AuthenticodeSignature $exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "signature: $($sig.Status) $($sig.StatusMessage)" }
          if ($null -eq $sig.TimeStamperCertificate) { throw "signature has no timestamp" }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName verify /pa /tw /v $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify: $LASTEXITCODE" }
          $v = (& $exe --version) -join " "
          if (-not $v.Contains("sacdfs-win $env:VERSION")) { throw "--version: $v" }
      - name: Package (signed)
        run: |
          python -I .github/scripts/pack-windows.py $env:PKG "$env:RUNNER_TEMP\signed\sacdfs-win.exe" COPYING CHANGELOG.md docs/install/windows.md=README.md
      - name: WinFsp (MSI, checked against its SHA-256)
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "winfsp.msi"
          Invoke-WebRequest $env:WINFSP_MSI -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne $env:WINFSP_SHA256) { throw "WinFsp MSI: SHA-256 differs" }
          $p = Start-Process msiexec.exe -ArgumentList "/i", $msi, "/qn", "/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec: $($p.ExitCode)" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: corpus-sha256
          path: ${{ runner.temp }}
      - name: The signed program serves the corpus as on Linux (winfsp/ci/checks.ps1)
        shell: powershell
        run: |
          Expand-Archive "dist\$env:PKG.zip" "$env:RUNNER_TEMP\check"
          winfsp\ci\checks.ps1 -Exe "$env:RUNNER_TEMP\check\sacdfs-win.exe" -Source tests\corpus\images `
            -Mount X: -Reference (Join-Path $env:RUNNER_TEMP "host.sha256") -Work $env:RUNNER_TEMP
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: win-signed
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # The installer (#340), packed once the binaries are built: its default version set to this
  # release's, so one-liner users get the release it came with unless they pass --version,
  # and the SHA-256 of the three archives built in (.github/scripts/stamp-installer.sh, which
  # first checks each archive against its .sha256). install.sh downloads an archive only if it
  # matches the value built in; this file is itself attested below, so the checksums don't
  # come from the same server as the archive.
  installer:
    name: installer, with the archives' checksums
    needs: [preflight, binaries, binary-i686]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: The installer, stamped with this version and the archives' checksums
        run: |
          mkdir -p installer
          sh .github/scripts/stamp-installer.sh "$VERSION" dist deploy/install.sh installer/install.sh
          # All four builds (the installer itself stops on i686, #488), and the release files
          # of each.
          for a in x86_64 x86_64-v3 aarch64 i686; do
            grep -q "^[0-9a-f]\{64\}  sacdfs-$VERSION-$a-linux\.tar\.gz\$" installer/install.sh
            grep -q "^[0-9a-f]\{64\}  sacdfs-$VERSION-$a-linux/sacdfs\$" installer/install.sh
            grep -q "^[0-9a-f]\{64\}  sacdfs-$VERSION-$a-linux/sacdfs-ctl\$" installer/install.sh
          done
          (cd installer && sha256sum install.sh > install.sh.sha256 && cat install.sh.sha256)
      # install.sh verifies release files beside it against built-in checksums, as users run
      # it: the x86_64 archive unpacked by the runner's user and its install.sh run with sudo
      # (a dry run) uses the files there and downloads nothing; with one of them altered, it uses
      # none and downloads the release (from a local server with the release's layout, which
      # logs every request).
      - name: install.sh uses verified release files beside it, and downloads when one is altered
        run: |
          # The folders the dry run checks, root's only, as on a real system (installer.yml).
          for d in / /opt /srv /usr /usr/local /etc; do
            [ -d "$d" ] || continue
            sudo chown root "$d"
            sudo setfacl -b "$d"
            sudo chmod go-w "$d"
          done
          t=$RUNNER_TEMP
          mkdir -p "$t/srv/aclater/sacdfs/releases/download/v$VERSION" "$t/u"
          cp dist/*.tar.gz "$t/srv/aclater/sacdfs/releases/download/v$VERSION/"
          python3 -I -m http.server --bind 127.0.0.1 --directory "$t/srv" 18766 >"$t/http.log" 2>&1 &
          url=http://127.0.0.1:18766/aclater/sacdfs/releases
          for _ in $(seq 50); do curl -fsS -o /dev/null "$url/download/v$VERSION/" && break; sleep 0.2; done
          pkg=sacdfs-$VERSION-x86_64-linux
          tar -C "$t/u" -xzf "dist/$pkg.tar.gz"
          run() {
            sudo env SACDFS_RELEASES_URL="$url" sh "$t/u/$pkg/install.sh" --iso-dir "$PWD/tests/corpus/images" \
              --platform linux --method ctl --dry-run >"$t/out.log" 2>&1 || { cat "$t/out.log"; exit 1; }
            cat "$t/out.log"
          }
          : >"$t/http.log"
          run
          grep -q "match the checksums built in ($pkg): using them" "$t/out.log"
          if grep -q 'downloading' "$t/out.log" || grep '"GET ' "$t/http.log"; then
            echo "::error::the verified release files were not used"; exit 1
          fi
          # One file altered, next to the installer published on its own: none used, the
          # release downloaded and checked against the checksum built in.
          cp installer/install.sh "$t/u/$pkg/install.sh"
          printf '\n' >>"$t/u/$pkg/sacdfs-ctl"
          run
          grep -q "sacdfs-ctl doesn't match the checksum built into install.sh" "$t/out.log"
          grep -q 'checksum OK (built in)' "$t/out.log"
          grep -q "\"GET /aclater/sacdfs/releases/download/v$VERSION/$pkg.tar.gz " "$t/http.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer
          path: installer/
          if-no-files-found: error
          retention-days: 7

  # Linux packages (#460): the x86_64 and aarch64 archives' files packed as .rpm and .deb with
  # nfpm (packaging/pack-linux.sh); the binary as built and tested above. On a manual run with
  # `packages_tag`, the archives are that release's, downloaded and checked against their
  # checksums and attestations instead. The previous final release's archives are packed the
  # same way, for the upgrade test.
  packages:
    name: Linux packages (rpm, deb)
    needs: [preflight, binaries]
    if: >-
      !cancelled() && (needs.binaries.result == 'success'
      || (github.event_name == 'workflow_dispatch' && inputs.packages_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gh attestation verify of the downloaded archives.
      attestations: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
    env:
      PREFLIGHT_VERSION: ${{ needs.preflight.outputs.version }}
      PACKAGES_TAG: ${{ inputs.packages_tag }}
      MACOS_RUN: ${{ inputs.macos_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: This release's version; on a manual run, the release can take packages
        id: inputs
        run: |
          fail() { echo "::error::$*"; exit 1; }
          if [[ -n "$PACKAGES_TAG" ]]; then
            [[ -z "$MACOS_RUN" ]] || fail "packages_tag and macos_run go in separate runs"
            [[ "$GITHUB_REF" == refs/heads/main ]] || fail "run this from main"
            [[ "$PACKAGES_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "packages_tag is not a version tag"
            assets=$(gh release view "$PACKAGES_TAG" --json assets --jq '.assets[].name')
            ! grep -qE '\.(rpm|deb)$' <<< "$assets" || fail "the release already has packages"
            grep -qx SHA256SUMS <<< "$assets" || fail "the release has no SHA256SUMS"
            version=${PACKAGES_TAG#v}
          else
            version=$PREFLIGHT_VERSION
          fi
          [[ -n "$version" ]] || fail "no version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: inputs.packages_tag == ''
        with:
          name: bin-x86_64
          path: in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: inputs.packages_tag == ''
        with:
          name: bin-aarch64
          path: in
      # fetch TAG DIR: a release's two archives, checked against SHA256SUMS and their
      # attestations (made by this workflow, from that tag).
      - name: The archives (manual run, the release's) and the previous release's
        run: |
          fetch() {
            local tag=$1 dir=$2 v=${1#v} a
            mkdir -p "$dir"
            gh release download "$tag" -D "$dir" -p SHA256SUMS \
              -p "sacdfs-$v-x86_64-linux.tar.gz" -p "sacdfs-$v-aarch64-linux.tar.gz"
            (cd "$dir" && sha256sum -c --ignore-missing SHA256SUMS \
              && [[ $(sha256sum -c --ignore-missing SHA256SUMS | grep -c ': OK$') == 2 ]] && rm SHA256SUMS)
            for a in x86_64 aarch64; do
              gh attestation verify "$dir/sacdfs-$v-$a-linux.tar.gz" --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" --source-ref "refs/tags/$tag" > /dev/null
              echo "$tag $a: checksum and attestation verified"
            done
          }
          if [[ -n "$PACKAGES_TAG" ]]; then
            fetch "$PACKAGES_TAG" in
          else
            (cd in && sha256sum -c "sacdfs-$VERSION-x86_64-linux.tar.gz.sha256" "sacdfs-$VERSION-aarch64-linux.tar.gz.sha256")
          fi
          # The newest final release before this version (0.7.0-rc.1 counts as 0.7.0).
          base=${VERSION%%-*}
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' \
            | while read -r v; do
                [[ "$v" != "$base" && $(printf '%s\n' "$v" "$base" | sort -V | head -n 1) == "$v" ]] && echo "$v"
              done | sort -V | tail -n 1)
          [[ -n "$prev" ]] || { echo "::error::no earlier release"; exit 1; }
          echo "previous release: $prev"
          fetch "v$prev" prev-in
      - name: nfpm ${{ env.NFPM_VERSION }} (checked against its SHA-256)
        run: |
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -C "$RUNNER_TEMP/nfpm" -xzf "$RUNNER_TEMP/nfpm.tar.gz" nfpm
          echo "$RUNNER_TEMP/nfpm" >> "$GITHUB_PATH"
      - name: Pack
        run: |
          nfpm --version | tail -n 3
          for a in x86_64 aarch64; do
            packaging/pack-linux.sh "in/sacdfs-$VERSION-$a-linux.tar.gz" pkg
            packaging/pack-linux.sh "$(ls prev-in/sacdfs-*-"$a"-linux.tar.gz)" prev
          done
          cd pkg
          ls -l
          [[ $(ls | wc -l) == 4 ]] || { echo "::error::not four packages"; exit 1; }
          for f in *; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
          mkdir ../tarballs && cp ../in/sacdfs-"$VERSION"-*-linux.tar.gz ../tarballs/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pkg-linux
          path: pkg/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pkg-prev
          path: prev/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pkg-tarballs
          path: tarballs/
          if-no-files-found: error
          retention-days: 7

  # Each package in a container of each distribution it is for, on its own processor
  # (packaging/test-packages.sh): install, package verify, systemd-analyze verify, the same
  # binary and the same mounted files as the archive's, sacdfs-ctl with the package's settings,
  # removal; then the previous release's package, enabled and with edited settings, upgraded.
  # Images pinned by digest (multi-arch indexes).
  packages-test:
    name: package test (${{ matrix.distro.name }}, ${{ matrix.arch }})
    needs: packages
    if: ${{ !cancelled() && needs.packages.result == 'success' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - {name: UBI 9, fmt: rpm, image: "registry.access.redhat.com/ubi9/ubi@sha256:1e9f0ed9fceafb40878bc1705ff124aa150e3fed873f18c42cdc2dded319e0a8"}
          - {name: UBI 10, fmt: rpm, image: "registry.access.redhat.com/ubi10/ubi@sha256:73ea54bfbfb586075bd3d45df6483a7f68875233c8cc7cebcf9b2bb42306c308"}
          - {name: Fedora 44, fmt: rpm, image: "registry.fedoraproject.org/fedora@sha256:98b558564d3510363f0f706a44b1ee9de461b030373d741c5729ae3f24d8cb26"}
          - {name: Fedora 45, fmt: rpm, image: "registry.fedoraproject.org/fedora@sha256:8430348a73c5a0e607b5de2cf9dd4741d9aa0891bbce3108588298102015f8c6"}
          - {name: Debian 12, fmt: deb, image: "docker.io/library/debian@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8"}
          - {name: Debian 13, fmt: deb, image: "docker.io/library/debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"}
          - {name: Ubuntu 22.04, fmt: deb, image: "docker.io/library/ubuntu@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde"}
          - {name: Ubuntu 24.04, fmt: deb, image: "docker.io/library/ubuntu@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8"}
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      ARCH: ${{ matrix.arch }}
      FMT: ${{ matrix.distro.fmt }}
      IMAGE: ${{ matrix.distro.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: pkg-*
          path: ${{ runner.temp }}/a
      - name: packaging/test-packages.sh in the container
        run: |
          a=$RUNNER_TEMP/a
          [[ $ARCH == x86_64 ]] && deb=amd64 || deb=arm64
          [[ $FMT == rpm ]] && glob="sacdfs-*.$ARCH.rpm" || glob="sacdfs_*_$deb.deb"
          mkdir -p "$RUNNER_TEMP/pk" "$RUNNER_TEMP/tar"
          find "$a/pkg-linux" "$a/pkg-prev" -name "$glob" -exec cp {} "$RUNNER_TEMP/pk/" \;
          ls -l "$RUNNER_TEMP/pk"
          tar -C "$RUNNER_TEMP/tar" -xzf "$a/pkg-tarballs/sacdfs-$VERSION-$ARCH-linux.tar.gz"
          docker run --rm --privileged --device /dev/fuse \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/pk:/pk:ro" -v "$RUNNER_TEMP/tar/sacdfs-$VERSION-$ARCH-linux:/tar:ro" \
            "$IMAGE" bash /src/packaging/test-packages.sh /pk /tar /src/tests/corpus/images

  # The source RPM for COPR (#460, packaging/make-srpm.sh): the release tag's source (on a
  # manual run with `packages_tag`, that tag's; on a dry run, this commit's), its crates from
  # `cargo vendor`, and packaging/sacdfs.spec. Built in UBI 10 with its own cargo.
  srpm:
    name: source RPM
    needs: preflight
    if: >-
      !cancelled() && (needs.preflight.result == 'success'
      || (github.event_name == 'workflow_dispatch' && inputs.packages_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest, as in ci.yml.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    env:
      REF: ${{ (inputs.packages_tag && format('refs/tags/{0}', inputs.packages_tag)) || (github.ref_type == 'tag' && github.ref) || github.sha }}
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core cargo rpm-build xz && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The tags, for the tag's source.
          fetch-depth: 0
      - name: The SRPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo --version
          packaging/make-srpm.sh "$REF" srpm
          cd srpm
          for f in *.src.rpm; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
          rpm -qpl ./*.src.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: srpm
          path: srpm/
          if-no-files-found: error
          retention-days: 7

  # The SRPM rebuilt with each distribution's own Rust, without network (as COPR builds), then
  # the built package installed and its mount checked against the archive's binary
  # (packaging/test-srpm.sh). The COPR targets: Fedora's current two, RHEL 9 and 10 (UBI here).
  srpm-test:
    name: SRPM rebuild (${{ matrix.distro.name }}, ${{ matrix.arch }})
    needs: [packages, srpm]
    if: ${{ !cancelled() && needs.packages.result == 'success' && needs.srpm.result == 'success' }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - {name: UBI 9, image: "registry.access.redhat.com/ubi9/ubi@sha256:1e9f0ed9fceafb40878bc1705ff124aa150e3fed873f18c42cdc2dded319e0a8"}
          - {name: UBI 10, image: "registry.access.redhat.com/ubi10/ubi@sha256:73ea54bfbfb586075bd3d45df6483a7f68875233c8cc7cebcf9b2bb42306c308"}
          - {name: Fedora 44, image: "registry.fedoraproject.org/fedora@sha256:98b558564d3510363f0f706a44b1ee9de461b030373d741c5729ae3f24d8cb26"}
          - {name: Fedora 45, image: "registry.fedoraproject.org/fedora@sha256:8430348a73c5a0e607b5de2cf9dd4741d9aa0891bbce3108588298102015f8c6"}
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.distro.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: srpm
          path: ${{ runner.temp }}/srpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pkg-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: packaging/test-srpm.sh in the container
        run: |
          mkdir -p "$RUNNER_TEMP/tar"
          tar -C "$RUNNER_TEMP/tar" -xzf "$RUNNER_TEMP/tarballs/sacdfs-$VERSION-$ARCH-linux.tar.gz"
          srpm=$(cd "$RUNNER_TEMP/srpm" && ls ./*.src.rpm)
          docker run --rm --privileged --device /dev/fuse \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/srpm:/srpm:ro" -v "$RUNNER_TEMP/tar/sacdfs-$VERSION-$ARCH-linux:/tar:ro" \
            "$IMAGE" bash /src/packaging/test-srpm.sh "/srpm/${srpm#./}" /tar /src/tests/corpus/images

  # The image is built and tested here without any write permission; publishing it (below,
  # on a tag) loads the very image tested.
  image:
    name: container image (${{ matrix.arch }})
    needs: preflight
    # Native runners for both architectures (#43): each image is tested where it runs.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # RUSTFLAGS is set explicitly (never a toolchain default); arm64 takes none.
          - {arch: amd64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64"}
          - {arch: arm64, runner: ubuntu-24.04-arm, rustflags: ""}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (generic CPU)
        run: |
          docker build -f Containerfile \
            --build-arg RUSTFLAGS="$IMAGE_RUSTFLAGS" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t sacdfs:release .
      - name: Container share test on this image (deploy/ci-share-test.sh)
        run: deploy/ci-share-test.sh sacdfs:release
      - name: Server log
        if: always()
        run: docker logs sacdfs 2>&1 | grep -v ' INFO  sacdfs::' | tail -n 200 || true
      - name: Save the tested image
        run: docker save sacdfs:release | gzip > "sacdfs-image-$ARCH.tar.gz" && ls -l sacdfs-image-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: sacdfs-image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # What a dry run would have published.
  dry-run:
    name: dry run summary
    if: github.ref_type != 'tag'
    needs: [preflight, binaries, binary-i686, macos, windows, image, installer, packages-test, srpm-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pkg-linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: srpm
          path: dist
      # A dry run has only the unsigned macOS archives and Windows zip: signing runs on a tag
      # only (macos-sign, windows-sign).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: win-unsigned
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: unsigned-mac-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: installer
          path: dist
      - name: Summary
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          {
            echo "## Dry run: sacdfs $VERSION, nothing published"
            echo
            echo "Release assets that a tag would publish:"
            echo
            echo '```'
            (cd dist && ls -l && cat ./*.sha256)
            echo '```'
            echo
            echo "A tag publishes the macOS archives signed and notarised, without \`-unsigned\` (job macos-sign), and the Windows zip signed when WINDOWS_SIGNING is required (job windows-sign)."
            echo
            echo "Image that a tag would push: \`$IMAGE:$VERSION\` and \`$IMAGE:latest\` (share test passed)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing, on a tag only.
  # It needs every build and test job; windows-sign only when WINDOWS_SIGNING is "required"
  # (skipped when it is "off", which preflight has checked), hence the explicit condition.
  release:
    name: GitHub release
    if: >-
      !cancelled() && github.ref_type == 'tag'
      && needs.preflight.result == 'success' && needs.binaries.result == 'success'
      && needs.binary-i686.result == 'success' && needs.macos.result == 'success'
      && needs.macos-sign.result == 'success' && needs.windows.result == 'success'
      && needs.image.result == 'success' && needs.installer.result == 'success'
      && needs.packages-test.result == 'success' && needs.srpm-test.result == 'success'
      && (needs.windows-sign.result == 'success'
        || (needs.windows-sign.result == 'skipped' && vars.WINDOWS_SIGNING == 'off'))
    needs: [preflight, binaries, binary-i686, macos, macos-sign, windows, windows-sign, image, installer, packages-test, srpm-test]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Build provenance attestations (Sigstore, through the workflow's OIDC token).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MACOS_RELEASE: ${{ vars.SACDFS_MACOS_RELEASE }}
      WINDOWS_SIGNING: ${{ vars.WINDOWS_SIGNING }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      # The Windows zip: signed (windows-sign) when WINDOWS_SIGNING is "required", else unsigned.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: vars.WINDOWS_SIGNING == 'required'
        with:
          name: win-signed
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: vars.WINDOWS_SIGNING == 'off'
        with:
          name: win-unsigned
          path: dist
      # macOS archives only once SACDFS_MACOS_RELEASE is "true" (see the top of this file):
      # the signed and notarised ones of job macos-sign (mac-*), never the unsigned-mac-* ones.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: vars.SACDFS_MACOS_RELEASE == 'true'
        with:
          pattern: mac-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pkg-linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: srpm
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.tar.gz.sha256 ./*.zip.sha256 install.sh.sha256 ./*.rpm.sha256 ./*.deb.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        id: attest
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/*.rpm
            dist/*.deb
      # The attestation also goes on the release as <asset>.intoto.jsonl (one bundle covers
      # both), so it can be checked offline; each copy is verified first.
      - name: Provenance bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for f in dist/*.tar.gz dist/*.zip dist/install.sh dist/*.rpm dist/*.deb; do
            cp "$BUNDLE" "$f.intoto.jsonl"
            gh attestation verify "$f" --bundle "$f.intoto.jsonl" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          {
            cat notes.md
            echo
            echo "## Downloads"
            echo
            echo "Linux binaries, glibc 2.17 or later (RHEL 7 era and later), needing FUSE and, as a user other than root, FUSE 3's \`fusermount3\` (package fuse3) or FUSE 2's \`fusermount\`; root needs neither:"
            echo
            echo "- \`sacdfs-$VERSION-x86_64-linux.tar.gz\`: generic x86-64, for any x86_64 CPU."
            echo "- \`sacdfs-$VERSION-x86_64-v3-linux.tar.gz\`: x86-64-v3 (AVX2, most Intel and AMD CPUs since about 2015): about 20 % less CPU for WAV files. It stops with an illegal-instruction error on older CPUs."
            echo "- \`sacdfs-$VERSION-aarch64-linux.tar.gz\`: aarch64 (64-bit ARM)."
            echo "- \`sacdfs-$VERSION-i686-linux.tar.gz\`: 32-bit x86 (Pentium 4, Atom and later), static: it needs no C library. Install it by hand ([binary guide](https://github.com/$GH_REPO/blob/main/docs/install/binary.md#32-bit-x86)); the installer and the image are 64-bit only."
            echo
            v=${VERSION/-/\~}
            echo "Linux packages of the binaries above, x86_64 and aarch64 (\`/usr/bin/sacdfs\` and a systemd unit, not enabled; they need fuse3; not signed with a package key: check the \`.sha256\` and the attestation; [packages guide](https://github.com/$GH_REPO/blob/main/docs/install/packages.md)):"
            echo
            echo "- \`sacdfs-$v-1.x86_64.rpm\`, \`sacdfs-$v-1.aarch64.rpm\`: Fedora, RHEL 9 and 10."
            echo "- \`sacdfs_$v-1_amd64.deb\`, \`sacdfs_$v-1_arm64.deb\`: Debian 12 and 13, Ubuntu 22.04 and 24.04."
            echo "- \`sacdfs-$v-1.src.rpm\`: the source RPM, which rebuilds offline with the distribution's own Rust."
            echo
            echo "Windows (x86_64, Windows 10 or 11): \`sacdfs-$VERSION-x86_64-windows.zip\`, \`sacdfs-win.exe\`, which needs [WinFsp](https://winfsp.dev) 2.1 or later ([Windows guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install/windows.md)). It uses WinFsp - Windows File System Proxy, Copyright (C) Bill Zissimopoulos, https://github.com/winfsp/winfsp. $( [[ "$WINDOWS_SIGNING" == required ]] && echo "Code-signed (Authenticode, timestamped)." || echo "Not code-signed." )"
            echo
            if [[ "$MACOS_RELEASE" == true ]]; then
            echo "macOS 11 or later, mounted by the Mac's own NFS client with nothing else installed (\`sacdfs-nfs\`; [macOS guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install/macos.md)). Signed with a Developer ID and notarised by Apple."
            echo
            echo "- \`sacdfs-$VERSION-aarch64-macos.tar.gz\`: Apple Silicon."
            echo "- \`sacdfs-$VERSION-x86_64-macos.tar.gz\`: Intel."
            echo
            fi
            echo "Container image for a NAS (SMB and NFS): \`$IMAGE:$VERSION\` (generic CPU; amd64 and arm64)."
            echo
            echo "Installer: \`install.sh\` finds the system (a NAS or Linux computer) and sets sacdfs up ([install guide](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install/README.md)). Over SSH:"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh \\"
            echo "  | sudo sh -s -- --iso-dir /path/to/images"
            echo '```'
            echo
            echo "Verify a download: \`sha256sum -c <asset>.sha256\` and \`gh attestation verify <asset> -R $GITHUB_REPOSITORY\`; the image: \`gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY\`. See the README, \"Install\"."
            echo
            echo "Built from $GITHUB_SHA."
          } > release-notes.md
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${pre[@]}" \
            --title "sacdfs $VERSION" --notes-file release-notes.md \
            dist/*.tar.gz dist/*.zip dist/*.rpm dist/*.deb dist/*.sha256 dist/*.intoto.jsonl dist/SHA256SUMS dist/install.sh

  # Linux packages and the source RPM of an earlier release, added to that tag's existing
  # release (see the top of this file), after every package and SRPM test above passed. Every
  # check runs before anything is uploaded.
  packages-publish:
    name: publish Linux packages of an earlier release
    needs: [packages, packages-test, srpm, srpm-test]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.packages_tag != ''
      && needs.packages.result == 'success' && needs.packages-test.result == 'success'
      && needs.srpm.result == 'success' && needs.srpm-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job at a time changes a release's SHA256SUMS.
    concurrency:
      group: release-assets-${{ inputs.packages_tag }}
      cancel-in-progress: false
    permissions:
      # Uploading assets and editing the notes of the existing release.
      contents: write
      # Build provenance attestations (Sigstore, through the workflow's OIDC token).
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.packages_tag }}
      VERSION: ${{ needs.packages.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The release still has no packages
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::run this from main"; exit 1; }
          [[ "$TAG" == "v$VERSION" ]] || { echo "::error::$TAG is not v$VERSION"; exit 1; }
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          ! grep -qE '\.(rpm|deb)(\.|$)' <<< "$assets" || { echo "::error::the release already has packages"; exit 1; }
          # The notes send people to the packages guide: it must describe them.
          guide=$(gh api "repos/$GH_REPO/contents/docs/install/packages.md?ref=main" -H "Accept: application/vnd.github.raw")
          grep -qF "sacdfs-$VERSION-1.x86_64.rpm" <<< "$guide" || { echo "::error::docs/install/packages.md on main doesn't describe $VERSION's packages"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pkg-linux
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: srpm
          path: dist
      - name: Checksums, and SHA256SUMS with the packages' lines appended
        run: |
          cd dist
          ls -l
          v=${VERSION/-/\~}
          want=$(printf '%s\n' "sacdfs-$v-1."{x86_64,aarch64,src}.rpm{,.sha256} "sacdfs_$v-1_"{amd64,arm64}.deb{,.sha256} | LC_ALL=C sort)
          [[ "$(ls | LC_ALL=C sort)" == "$want" ]] || { echo "::error::unexpected files"; exit 1; }
          sha256sum -c ./*.sha256
          gh release download "$TAG" -p SHA256SUMS -D ../old
          cp ../old/SHA256SUMS SHA256SUMS
          cat ./*.rpm.sha256 ./*.deb.sha256 >> SHA256SUMS
          # The published lines stay byte for byte; only the five new ones follow them.
          cmp <(head -c "$(stat -c %s ../old/SHA256SUMS)" SHA256SUMS) ../old/SHA256SUMS
          [[ $(wc -l < SHA256SUMS) == $(( $(wc -l < ../old/SHA256SUMS) + 5 )) ]]
          sha256sum -c --ignore-missing SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.rpm
            dist/*.deb
      - name: Provenance bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for f in dist/*.rpm dist/*.deb; do
            cp "$BUNDLE" "$f.intoto.jsonl"
            gh attestation verify "$f" --bundle "$f.intoto.jsonl" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
      - name: Add the packages, SHA256SUMS and the notes' package lines to the release
        run: |
          # SHA256SUMS unchanged since it was read above (another job may add assets too).
          gh release download "$TAG" -p SHA256SUMS -D now
          cmp now/SHA256SUMS old/SHA256SUMS
          # No --clobber: an asset of the same name already there stops it.
          gh release upload "$TAG" dist/*.rpm dist/*.deb dist/*.sha256 dist/*.intoto.jsonl
          gh release upload "$TAG" --clobber dist/SHA256SUMS
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            v=${VERSION/-/\~}
            echo "Linux packages of the binaries above, x86_64 and aarch64 (\`/usr/bin/sacdfs\` and a systemd unit, not enabled; they need fuse3; not signed with a package key: check the \`.sha256\` and the attestation; [packages guide](https://github.com/$GH_REPO/blob/main/docs/install/packages.md)):"
            echo
            echo "- \`sacdfs-$v-1.x86_64.rpm\`, \`sacdfs-$v-1.aarch64.rpm\`: Fedora, RHEL 9 and 10."
            echo "- \`sacdfs_$v-1_amd64.deb\`, \`sacdfs_$v-1_arm64.deb\`: Debian 12 and 13, Ubuntu 22.04 and 24.04."
            echo "- \`sacdfs-$v-1.src.rpm\`: the source RPM, which rebuilds offline with the distribution's own Rust."
            echo
            echo "The packages were added after the release, from its published archives and its tag's source, by a later run on \`main\` ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID), which their attestation names."
            echo
          } > packages.md
          if grep -q '^Windows (x86_64' notes.md; then
            awk 'FNR == NR { m = m $0 "\n"; next } /^Windows \(x86_64/ { printf "%s", m } { print }' \
              packages.md notes.md > new-notes.md
            gh release edit "$TAG" --notes-file new-notes.md
          else
            echo "::warning::no place for the package lines in the notes; left unchanged"
          fi
      - name: The release as published
        run: |
          mkdir check && cd check
          gh release download "$TAG" -p "*.rpm*" -p "*.deb*" -p SHA256SUMS
          ls -l
          sha256sum -c ./*.sha256
          sha256sum -c --ignore-missing SHA256SUMS
          cmp SHA256SUMS ../dist/SHA256SUMS
          # A few tries: the API may lag the attestation.
          for f in ./*.rpm ./*.deb; do
            for try in 1 2 3 4 5; do
              gh attestation verify "$f" --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" && break
              [[ $try == 5 ]] && { echo "::error::no attestation verifies $f"; exit 1; }
              sleep 20
            done
          done

  # The macOS archives of an earlier release run, added to that tag's existing release (see
  # the top of this file). Every check runs before anything is uploaded.
  macos-publish:
    name: publish macOS archives of a release run
    if: github.event_name == 'workflow_dispatch' && inputs.macos_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job at a time adds assets to a release, so none overwrites another's SHA256SUMS lines.
    concurrency:
      group: release-assets-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      # The other run's artifacts.
      actions: read
      # Uploading assets and editing the notes of the existing release.
      contents: write
      # Build provenance attestations (Sigstore, through the workflow's OIDC token).
      id-token: write
      attestations: write
    env:
      RUN: ${{ inputs.macos_run }}
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: The run is this tag's successful release run, the release has no macOS assets
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main ]] || fail "run this from main"
          [[ "$RUN" =~ ^[0-9]+$ ]] || fail "macos_run is not a run id"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || fail "tag is not a version tag"
          IFS=$'\t' read -r path event branch sha conclusion < <(gh api "repos/$GH_REPO/actions/runs/$RUN" \
            --jq '[.path, .event, .head_branch, .head_sha, .conclusion] | @tsv')
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          echo "run $RUN: $path, $event, $branch, $sha, $conclusion; $TAG is $tag_sha"
          [[ "$path" == .github/workflows/release.yml ]] || fail "run $RUN is not a release run"
          [[ "$event" == push && "$branch" == "$TAG" ]] || fail "run $RUN is not the push of $TAG"
          [[ "$sha" == "$tag_sha" ]] || fail "run $RUN built $sha, not $TAG ($tag_sha)"
          [[ "$conclusion" == success ]] || fail "run $RUN did not succeed"
          # Only signed and notarised archives (job macos-sign, both architectures).
          signed=$(gh api "repos/$GH_REPO/actions/runs/$RUN/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name | startswith("sign and notarise")) | .conclusion' | grep -c '^success$' || true)
          [[ "$signed" == 2 ]] || fail "run $RUN has no signed and notarised macOS archives (macos-sign)"
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          ! grep -q -- '-macos\.' <<< "$assets" || fail "the release already has macOS assets"
          grep -qx SHA256SUMS <<< "$assets" || fail "the release has no SHA256SUMS"
          # The notes send people to the macOS guide: it must describe the archives.
          guide=$(gh api "repos/$GH_REPO/contents/docs/install/macos.md?ref=main" -H "Accept: application/vnd.github.raw")
          grep -q -- '-macos\.tar\.gz' <<< "$guide" || fail "docs/install/macos.md on main doesn't describe the archives"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: mac-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.macos_run }}
          github-token: ${{ github.token }}
      - name: Checksums, and SHA256SUMS with the macOS lines appended
        run: |
          cd dist
          ls -l
          want=$(printf '%s\n' "sacdfs-$VERSION-"{aarch64,x86_64}-macos.tar.gz{,.sha256} | LC_ALL=C sort)
          [[ "$(ls | LC_ALL=C sort)" == "$want" ]] || { echo "::error::unexpected files"; exit 1; }
          sha256sum -c ./*.sha256
          gh release download "$TAG" -p SHA256SUMS -D ../old
          cp ../old/SHA256SUMS SHA256SUMS
          cat "sacdfs-$VERSION-aarch64-macos.tar.gz.sha256" "sacdfs-$VERSION-x86_64-macos.tar.gz.sha256" >> SHA256SUMS
          # The published lines stay byte for byte; only the two new ones follow them.
          cmp <(head -c "$(stat -c %s ../old/SHA256SUMS)" SHA256SUMS) ../old/SHA256SUMS
          [[ $(wc -l < SHA256SUMS) == $(( $(wc -l < ../old/SHA256SUMS) + 2 )) ]]
          sha256sum -c --ignore-missing SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Provenance bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for f in dist/*.tar.gz; do
            cp "$BUNDLE" "$f.intoto.jsonl"
            gh attestation verify "$f" --bundle "$f.intoto.jsonl" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          done
      - name: Add the assets, SHA256SUMS and the notes' macOS lines to the release
        run: |
          # No --clobber: an asset of the same name already there stops it.
          gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.intoto.jsonl
          # SHA256SUMS unchanged since it was read above, or nothing replaces it.
          gh release download "$TAG" -p SHA256SUMS -D now
          cmp now/SHA256SUMS old/SHA256SUMS \
            || { echo "::error::SHA256SUMS changed since it was read; repair by hand (CONTRIBUTING.md)"; exit 1; }
          gh release upload "$TAG" --clobber dist/SHA256SUMS
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo "macOS 11 or later, mounted by the Mac's own NFS client with nothing else installed (\`sacdfs-nfs\`; [macOS guide](https://github.com/$GH_REPO/blob/main/docs/install/macos.md)). Signed with a Developer ID and notarised by Apple."
            echo
            echo "- \`sacdfs-$VERSION-aarch64-macos.tar.gz\`: Apple Silicon."
            echo "- \`sacdfs-$VERSION-x86_64-macos.tar.gz\`: Intel."
            echo
            echo "The macOS archives were added after the release, from this tag's release run ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$RUN); their attestation names the later run on \`main\` that published them ($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)."
            echo
          } > macos.md
          if grep -q '^Container image for a NAS' notes.md; then
            awk 'FNR == NR { m = m $0 "\n"; next } /^Container image for a NAS/ { printf "%s", m } { print }' \
              macos.md notes.md > new-notes.md
            gh release edit "$TAG" --notes-file new-notes.md
          else
            echo "::warning::no place for the macOS lines in the notes; left unchanged"
          fi
      - name: The release as published
        run: |
          mkdir check && cd check
          gh release download "$TAG" -p "*-macos.tar.gz*" -p SHA256SUMS
          ls -l
          sha256sum -c ./*.sha256
          sha256sum -c --ignore-missing SHA256SUMS
          cmp SHA256SUMS ../dist/SHA256SUMS
          # A few tries: the API may lag the attestation.
          for f in ./*.tar.gz; do
            for try in 1 2 3 4 5; do
              gh attestation verify "$f" --repo "$GH_REPO" \
                --signer-workflow "$GH_REPO/.github/workflows/release.yml" && break
              [[ $try == 5 ]] && { echo "::error::no attestation verifies $f"; exit 1; }
              sleep 20
            done
          done

  image-publish:
    name: publish image
    # Not skipped when release ran after a skipped windows-sign (WINDOWS_SIGNING off).
    if: >-
      !cancelled() && github.ref_type == 'tag' && needs.preflight.result == 'success'
      && needs.image.result == 'success' && needs.release.result == 'success'
    needs: [preflight, image, release]
    runs-on: ubuntu-latest
    permissions:
      # Pushing to ghcr.io, and the attestation pushed next to the image.
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
      - name: Push both images and the multi-arch manifest
        id: push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Each architecture's tested image is pushed under <version>-<arch>, then
          # <version> (and :latest) become a manifest list of the two.
          for arch in amd64 arm64; do
            docker load < "image-$arch/sacdfs-image-$arch.tar.gz"
            docker tag sacdfs:release "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
            tag_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION-$arch")
            tag_digest=${tag_digest#*@}
            # The tag can be an index of the image and Docker's build record (amd64, #379):
            # attest the image's own manifest, the digest a pull resolves to, and the tag too.
            raw=$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION-$arch")
            case $(jq -r .mediaType <<<"$raw") in
              *index* | *manifest.list*)
                digest=$(jq -er --arg a "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest]
                  | if length == 1 then .[0] else error("not one linux/\($a) image") end' <<<"$raw") ;;
              *) digest=$tag_digest ;;
            esac
            echo "digest_$arch=$digest" >> "$GITHUB_OUTPUT"
            echo "tag_digest_$arch=$tag_digest" >> "$GITHUB_OUTPUT"
            echo "$arch: image $digest, tag $tag_digest"
            docker rmi sacdfs:release
          done
          tags=("$IMAGE:$VERSION")
          # A pre-release (0.2.0-rc.1) doesn't move :latest.
          [[ "$VERSION" == *-* ]] || tags+=("$IMAGE:latest")
          for t in "${tags[@]}"; do
            docker buildx imagetools create -t "$t" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed ${tags[*]} ($digest)"
      - name: Attest build provenance (manifest list)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (amd64 image)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest_amd64 }}
          push-to-registry: true
      - name: Attest build provenance (arm64 image)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest_arm64 }}
          push-to-registry: true
      - name: Attest build provenance (amd64 tag, when an index)
        if: github.ref_type == 'tag' && steps.push.outputs.tag_digest_amd64 != steps.push.outputs.digest_amd64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.tag_digest_amd64 }}
          push-to-registry: true
      - name: Attest build provenance (arm64 tag, when an index)
        if: github.ref_type == 'tag' && steps.push.outputs.tag_digest_arm64 != steps.push.outputs.digest_arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.tag_digest_arm64 }}
          push-to-registry: true
      - name: Verify the image attestations
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGESTS: >-
            ${{ steps.push.outputs.digest }} ${{ steps.push.outputs.digest_amd64 }}
            ${{ steps.push.outputs.digest_arm64 }} ${{ steps.push.outputs.tag_digest_amd64 }}
            ${{ steps.push.outputs.tag_digest_arm64 }}
        run: |
          # What a user checks: the index, each image by the digest a pull resolves to, and
          # each -<arch> tag (#379). A few tries: the API may lag the attestation.
          for d in $(tr ' ' '\n' <<<"$DIGESTS" | sort -u); do
            for try in 1 2 3 4 5; do
              gh attestation verify "oci://$IMAGE@$d" -R "$GITHUB_REPOSITORY" > /dev/null && break
              [[ $try == 5 ]] && { echo "::error::no attestation verifies $IMAGE@$d"; exit 1; }
              sleep 15
            done
            echo "verified $IMAGE@$d"
          done
      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  # crates.io (#155), after the GitHub release, on final versions only: a version on
  # crates.io can never be deleted or reused, only yanked, and release candidates are
  # tested from the GitHub release and the image, not from crates.io.
  # Trusted publishing: crates-io-auth-action trades this job's OIDC token for a crates.io
  # token valid for 30 minutes; crates.io accepts it only from this repository's
  # release.yml, as configured in the crate's settings there. Trusted publishing cannot
  # create a crate, so the owner publishes the first version (0.4.0) by hand
  # (CONTRIBUTING.md, "Releasing"); this job then finds that version on crates.io and only
  # logs it.
  crates-publish:
    name: publish to crates.io
    # Not skipped when release ran after a skipped windows-sign (WINDOWS_SIGNING off).
    if: >-
      !cancelled() && github.ref_type == 'tag' && !contains(needs.preflight.outputs.version, '-')
      && needs.preflight.result == 'success' && needs.release.result == 'success'
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Checking out the tagged sources.
      contents: read
      # The OIDC token crates-io-auth-action exchanges for a crates.io token.
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Is this version on crates.io already?
        id: check
        run: |
          ua="sacdfs release workflow (https://github.com/$GITHUB_REPOSITORY)"
          crate=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/sacdfs)
          if [[ "$crate" == 404 ]]; then
            echo "::error::sacdfs is not on crates.io yet. Trusted publishing cannot create a crate: publish $VERSION by hand from this tag (CONTRIBUTING.md, \"Releasing\"), set up the trusted publisher, then re-run this job"
            exit 1
          elif [[ "$crate" != 200 ]]; then
            echo "::error::crates.io API returned HTTP $crate for the crate"
            exit 1
          fi
          code=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/sacdfs/$VERSION")
          if [[ "$code" == 200 ]]; then
            echo "::notice::sacdfs $VERSION is already on crates.io (published by hand); nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == 404 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io API returned HTTP $code for sacdfs $VERSION"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check.outputs.publish == 'true'
        with:
          persist-credentials: false
      - name: Rust toolchain
        if: steps.check.outputs.publish == 'true'
        run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Authenticate with crates.io (trusted publishing)
        if: steps.check.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: cargo publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
