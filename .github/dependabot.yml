# Keeps the commit-SHA pins in .github/workflows and the Cargo dependencies current.
# Actions are pinned by SHA rather than tag so a moved tag can't change what runs in CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait two weeks before a PR is opened.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: deps
