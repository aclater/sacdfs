# Whether a pull request changes anything but Markdown documentation, for the workflows with
# required checks (ci, coverage, container, nfs, codeql). A required check must always report:
# a workflow skipped by a `paths` filter leaves its checks pending and blocks the merge, but a job
# skipped by its `if` reports success. So those workflows call this one and skip their heavy jobs,
# or the steps of a matrix job (whose name a skipped job would not expand), when `code` is
# 'false'. Callers test `!= 'false'`, so a failed or missing answer runs everything.
#
# Documentation is every *.md file except docs/options.md, which the `readme options` check
# compares with `sacdfs --help`. Pushes to main and every other event count as code.
name: changes

on:
  workflow_call:
    outputs:
      code:
        description: "'false' when the pull request changes only Markdown documentation, else 'true'"
        value: ${{ jobs.changes.outputs.code }}

permissions:
  contents: read

jobs:
  changes:
    name: code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # Commits and trees only: the names of the changed files need no file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2  # a pull request's checkout is its merge commit: the first parent is the base
          filter: blob:none
          sparse-checkout: .github
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  docs/options.md) code=true ;;
                  *.md) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
            echo "Changed files:"
            printf '%s\n' "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
