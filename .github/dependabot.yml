# Keeps the commit-SHA pins in .github/workflows and the Cargo dependencies current.
# Actions are pinned by SHA rather than tag so a moved tag can't change what runs in CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait two weeks before a PR is opened.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: deps
  # The lock files of the fuzz targets and of the Windows front end, each its own workspace.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-fuzz:
        patterns: ["*"]
    commit-message:
      prefix: deps
  - package-ecosystem: cargo
    directory: /winfsp
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-winfsp:
        patterns: ["*"]
    commit-message:
      prefix: deps
  # The base images of Containerfile, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: container
  # Tools CI installs from PyPI by hash (.github/requirements), such as zizmor.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci
