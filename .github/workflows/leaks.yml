# Leak hunting off PR CI (#151): every week, and on demand, the test suite under valgrind
# memcheck and a short soak on the corpus. Too slow for every pull request (pull request CI
# is kept fast); pull requests run only tests/no_growth.rs, in the tests job. The
# long soak (hours, real discs) runs on a test host: see docs/development.md.
name: leaks

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  memcheck:
    name: memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest. See .github/scripts/ci-container-setup.sh. FUSE: the device and the right to mount.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc fuse3 python3 valgrind procps-ng && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: false
          prefix-key: v0-rust-ubi10
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - name: Test suite under memcheck
        run: scripts/leak-check.sh memcheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: memcheck
          path: target/leak-check/
          retention-days: 14

  soak:
    name: soak (corpus, 20 min)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: false
      - name: Install fusermount3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
      - run: cargo build --locked --release
      - name: Soak
        run: |
          mkdir -p target/soak-images
          for i in dsd-stereo-mch-2048 dst-features-2ch-6ch dst-features-4ch album-set-disc-2-of-3; do
            ln -s "$PWD/tests/corpus/images/$i.iso" target/soak-images/
          done
          # The work directory is where the soak mounts. Not the default under /var/tmp: on this
          # runner fusermount3 is refused a mount there ("Permission denied"; probably Ubuntu's
          # AppArmor profile for it, not checked); under the runner's home it mounts.
          python3 -I scripts/soak.py --sacdfs target/release/sacdfs --images target/soak-images \
            --work "$RUNNER_TEMP/soak-work" --sample-paths --hours 0.33 --interval 30 --warmup 300 --cache-mb 16 --out target/soak.tsv
      - name: Soak logs (sacdfs's stderr and log, from the work directory)
        if: always()
        run: |
          mkdir -p target/soak-logs
          cp "$RUNNER_TEMP"/soak-work/*.stderr "$RUNNER_TEMP"/soak-work/*.log target/soak-logs/ 2>/dev/null || true
          tail -n 40 "$RUNNER_TEMP"/soak-work/*.stderr 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: soak
          path: |
            target/soak.tsv
            target/soak.errors.tsv
            target/soak-logs/
          retention-days: 14
