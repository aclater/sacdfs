# Weekly scan of the published container image for known vulnerabilities with grype (#399).
# Fails on High or Critical findings that have a fixed package version, so a base-image update
# that is due shows up between releases. The full table is in the log and the job summary.
# Locally: `grype registry:ghcr.io/aclater/sacdfs:latest --platform linux/amd64 --only-fixed --fail-on high`
name: image-scan

on:
  schedule:
    - cron: "53 5 * * 3"  # Wednesdays, 05:53 UTC: new advisories appear without a code change
  workflow_dispatch:
    inputs:
      image:
        description: Image reference to scan
        required: false
        default: ghcr.io/aclater/sacdfs:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    name: grype (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # grype reads each platform's image from the registry index itself (no Docker pull,
        # no emulation), so both run on the amd64 runner.
        platform: [linux/amd64, linux/arm64]
    env:
      IMAGE: ${{ inputs.image || 'ghcr.io/aclater/sacdfs:latest' }}
      PLATFORM: ${{ matrix.platform }}
      # The release binary (static), pinned by version and SHA-256, in place of the grype
      # action, which installs it with a script fetched at run time.
      GRYPE_VERSION: 0.121.0
      GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
    steps:
      - name: grype
        shell: bash
        run: |
          tarball="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/$tarball"
          echo "$GRYPE_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c
          mkdir "$RUNNER_TEMP/grype"
          tar -C "$RUNNER_TEMP/grype" -xzf "$RUNNER_TEMP/$tarball" grype
          "$RUNNER_TEMP/grype/grype" version

          # Exit 2: a fixable finding at High or above; exit 1: the scan itself failed.
          status=0
          "$RUNNER_TEMP/grype/grype" "registry:$IMAGE" --platform "$PLATFORM" \
            --only-fixed --fail-on high -o table --file "$RUNNER_TEMP/report.txt" || status=$?
          cat "$RUNNER_TEMP/report.txt" || true
          {
            echo "### grype: $IMAGE ($PLATFORM), fixable findings, exit $status"
            echo '```'
            cat "$RUNNER_TEMP/report.txt" || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
