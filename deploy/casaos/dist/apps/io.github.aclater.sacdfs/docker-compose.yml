name: sacdfs
services:
  sacdfs:
    image: ghcr.io/aclater/sacdfs:0.6.4@sha256:2039b43f413feafed41504f6c91170538bb18c3f40f01971b21a2d01e4609192
    container_name: sacdfs
    restart: unless-stopped
    # Least privilege: none of the runtime's default capabilities, only the seven the
    # programs need (https://github.com/aclater/sacdfs/blob/main/docs/deployment.md#privileges).
    devices:
      - /dev/fuse:/dev/fuse
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SETPCAP
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile forbids mount(2), which FUSE needs.
      - apparmor=unconfined
    ports:
      - target: 445
        published: "10445"
        protocol: tcp
      - target: 2049
        published: "12049"
        protocol: tcp
    volumes:
      # The folder that holds your SACD images (ISO files), read-only.
      - type: bind
        source: /DATA/Media/Music
        target: /images
        read_only: true
      # The index cache: restarts then skip re-reading every image.
      - type: bind
        source: /DATA/AppData/$AppID/cache
        target: /cache
    environment:
      SACDFS_FORMATS: dsf,wav
      SACDFS_FLATTEN: "0"
      # Leave both empty for guest access (read-only) from the whole network.
      SMB_USER: ""
      SMB_PASSWORD: ""
      NFS_CLIENTS: "*"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    stop_grace_period: 30s
x-casaos:
  id: io.github.aclater.sacdfs
  main: sacdfs
  index: /
  port_map: ""
  icon: https://cdn.jsdelivr.net/gh/aclater/sacdfs@store-apps/deploy/casaos/dist/apps/io.github.aclater.sacdfs/assets/icon.svg
  title:
    en_US: sacdfs
  version: "0.6.4"
