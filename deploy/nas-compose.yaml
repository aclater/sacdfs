# SPDX-License-Identifier: GPL-3.0-or-later
#
# sacdfs on a NAS, from the published image, for the NAS container managers that take a
# Compose file: Synology Container Manager, QNAP Container Station, UGREEN UGOS Docker,
# TerraMaster TOS Docker, Unraid's Compose plugin, OpenMediaVault's Compose plugin, ASUSTOR
# Docker, and plain `docker compose` or `podman compose` (rootful, for NFS).
#
# The only line to edit is the path of your images (marked below). Then:
#
#   docker compose -f nas-compose.yaml up -d
#
# What each guide checked, and where, is in docs/install/. Every setting: docs/deployment.md.
services:
  sacdfs:
    image: ghcr.io/aclater/sacdfs:0.5.0
    container_name: sacdfs
    restart: unless-stopped
    # FUSE needs the device and CAP_SYS_ADMIN (to mount). NFS-Ganesha needs
    # CAP_DAC_READ_SEARCH (open_by_handle_at, how it reopens files by NFS file handle).
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opt:
      # Docker's default AppArmor profile forbids mount(2) even with CAP_SYS_ADMIN, on NAS
      # systems that use AppArmor. Harmless where there is none (ADM, DSM, SELinux hosts).
      - apparmor=unconfined
      # - label=disable   # SELinux hosts (Fedora, RHEL): uncomment, so your folder's labels stay
    ports:
      # Other ports than 445 and 2049: the NAS's own SMB and NFS services usually hold
      # those. Clients name these ports when they mount (docs/install/linux-client.md).
      - "10445:445"
      - "12049:2049"
    volumes:
      # EDIT THIS LINE: the folder that holds your SACD images (ISO files), as an absolute
      # path on the NAS, before the colon. Keep ":/images:ro": it is read-only.
      - /volume1/music:/images:ro
      # sacdfs's index cache: restarts then skip re-reading every image.
      - sacdfs-cache:/cache
    environment:
      # DSF and WAV files; "dsf" alone for Roon or MPD (docs/install/roon.md, mpd.md).
      SACDFS_FORMATS: dsf,wav
      # "1": one folder per disc instead of per area (see docs/deployment.md).
      SACDFS_FLATTEN: "0"
      # Without these two lines the shares are open to the whole network (guest, read-only).
      # SMB_USER: music
      # SMB_PASSWORD: change-me
      # NFS_CLIENTS: 192.168.1.0/24   # who may mount over NFS: default: everyone
    # The health check, in the file because Podman's OCI image format cannot carry one. The
    # long start period lets a large library on a slow disk finish mounting.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    # How long the runtime waits after SIGTERM before SIGKILL. The entry point stops the servers,
    # then sacdfs, each within 10 s at most; it takes under a second when nothing is open.
    stop_grace_period: 20s

volumes:
  sacdfs-cache:
