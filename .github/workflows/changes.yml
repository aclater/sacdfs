# Whether a pull request changes anything but Markdown documentation, for the workflows with
# required checks (ci, coverage, container, nfs, codeql). A required check must always report:
# a workflow skipped by a `paths` filter leaves its checks pending and blocks the merge, but a job
# skipped by its `if` reports success. So those workflows call this one and skip their heavy jobs,
# or the steps of a matrix job (whose name a skipped job would not expand), when `code` is
# 'false'. Callers test `!= 'false'`, so a failed or missing answer runs everything.
#
# Besides `code`, three more answers let the workflows with heavy jobs skip them on a pull request
# that cannot affect them (same rule: a job skipped by its `if` reports success):
#   rust       'false' only when every changed file is documentation, a licence, an issue template,
#              dependabot.yml, the Containerfile, deploy/ or packaging/ (coverage, nfs export);
#              any other path counts as Rust input
#   container  'false' only when every changed file is documentation, a licence, an issue template
#              or dependabot.yml
#   workflows  'false' unless the pull request touches .github (CodeQL's `actions` analysis)
# All are 'true' for every event but a pull request, and when the answer is missing.
#
# Documentation is every *.md file except docs/options.md, which the `readme options` check
# compares with `sacdfs --help`. Pushes to main and every other event count as code.
name: changes

on:
  workflow_call:
    outputs:
      code:
        description: "'false' when the pull request changes only Markdown documentation, else 'true'"
        value: ${{ jobs.changes.outputs.code }}
      rust:
        description: "'false' when the pull request touches nothing the Rust build, tests or CI scripts use"
        value: ${{ jobs.changes.outputs.rust }}
      container:
        description: "'false' when the pull request touches nothing the container image checks use"
        value: ${{ jobs.changes.outputs.container }}
      workflows:
        description: "'false' when the pull request touches nothing under .github"
        value: ${{ jobs.changes.outputs.workflows }}

permissions:
  contents: read

jobs:
  changes:
    name: code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rust: ${{ steps.classify.outputs.rust }}
      container: ${{ steps.classify.outputs.container }}
      workflows: ${{ steps.classify.outputs.workflows }}
    steps:
      # Commits and trees only: the names of the changed files need no file contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2  # a pull request's checkout is its merge commit: the first parent is the base
          filter: blob:none
          sparse-checkout: .github
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          code=true rust=true container=true workflows=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            if [ -n "$files" ]; then
              code=false rust=false container=false workflows=false
              while IFS= read -r f; do
                case "$f" in
                  docs/options.md) code=true ;;
                  *.md) ;;
                  *) code=true ;;
                esac
                # An ignore list, so a path nobody listed (a new crate directory, .cargo/config.toml,
                # rust-toolchain.toml) counts as Rust and container input.
                case "$f" in
                  *.md|docs/*|COPYING|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml) ;;
                  Containerfile|deploy/*|packaging/*) container=true ;;
                  *) rust=true container=true ;;
                esac
                case "$f" in
                  .github/*) workflows=true ;;
                esac
              done <<< "$files"
            fi
            echo "Changed files:"
            printf '%s\n' "$files"
          fi
          echo "code=$code"
          echo "rust=$rust container=$container workflows=$workflows"
          {
            echo "code=$code"
            echo "rust=$rust"
            echo "container=$container"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
