[package]
name = "sacdfs"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only FUSE filesystem that shows SACD disc images as DSF files, decoded on demand"
license = "GPL-3.0-or-later"
repository = "https://github.com/aclater/sacdfs"
readme = "README.md"
keywords = ["sacd", "dsd", "dsf", "fuse", "filesystem"]
categories = ["filesystem", "multimedia::audio", "command-line-utilities"]
# What `cargo install sacdfs` and `cargo build` need, nothing else (#155): no tests, test
# images, benches, CI, deploy files or docs. The examples aren't declared here, so they stay out.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/COPYING",
    "/CHANGELOG.md",
]

[dependencies]
# The engine: SACD parsing, demultiplexing and DST decoding, from crates.io, pinned exactly
# (published from the release tag).
scarletbook = "=0.5.9"
# The DSD-to-PCM converter behind the WAV files (#84), from the same release as the engine.
scarletbook-pcm = "=0.5.9"
# Pure-Rust FUSE: no libfuse needed, mounts through fusermount3.
fuser = { version = "0.18", default-features = false }
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
libc = "0.2"
log = "0.4"
lru = "0.19"
# statvfs of SOURCE for statfs (#62), without `unsafe` in sacdfs. Already in the graph
# through fuser, with the same feature.
nix = { version = "0.31", default-features = false, features = ["fs"] }
rayon = "1.10"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
# Names and checksums of the persistent seek index's files.
sha2 = "0.11"
# The tags files (#81): TOML, read and written through serde.
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
# `sacdfs tags fetch` (#185) only: HTTPS to MusicBrainz and its JSON. rustls with its bundled
# roots, so that the release's binary depends on no system TLS library or CA store.
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"

[dev-dependencies]
# The converter benchmark (benches/pcm.rs); no plots, no rayon.
# The no-growth test (tests/no_growth.rs, #151): counts the heap live after each mount.
dhat = "0.3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[[bench]]
name = "pcm"
harness = false

# One process per trial, and no libtest thread that could take the signal (#334).
[[test]]
name = "stop_signals"
harness = false

[lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"

[lints.clippy]
# Panics on hostile input are bugs; these catch the common sources.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
overflow-checks = true

# scarletbook in one codegen unit (#270). *Why:* split into cargo's default 16, its DST decoder ran
# about 4 % more cycles than in the library's own builds (instructions within 1 %), and 6-channel
# DST on one thread read up to 1.24x the library on a NAS-class CPU. In one unit the decoder's
# cycles match the library's. *Only scarletbook:* one unit for the whole binary decoded no faster
# and builds slower; fat LTO ran 14 % more instructions and 8 % more cycles, so it isn't used.
[profile.release.package.scarletbook]
codegen-units = 1

# DST decoding in unoptimised test builds is slow.
[profile.test]
opt-level = 2

[profile.dev.package.scarletbook]
opt-level = 2
