# CI: formatting, clippy, the tests (including the FUSE tests that mount the corpus), and a
# check that the README's options table matches `sacdfs --help`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy && rustup default "$RUST_STABLE"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Install fusermount3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: cargo test --locked
      - name: Converter benchmark (smoke test, each case once)
        run: cargo bench --locked --bench pcm -- --test

  # The same tests on aarch64 (#43), on a native arm64 runner.
  test-arm64:
    name: tests (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Install fusermount3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: cargo test --locked

  readme-options:
    name: readme options
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - run: cargo build --locked --quiet
      - name: The README's options table matches sacdfs --help
        run: target/debug/sacdfs --help | python3 -I .github/scripts/check-readme-options.py README.md

  private-names:
    # Commit identities and tracked files must carry no private details (home.arpa names,
    # private addresses in identities, and the PRIVATE_NAMES repository variable, a regex kept
    # outside the repository). See scripts/check-private-names.sh.
    name: no private names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan files and commit identities
        env:
          PRIVATE_NAMES: ${{ vars.PRIVATE_NAMES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-private-names.sh
