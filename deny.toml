# cargo-deny: licences, advisories, bans and sources of every dependency.
# Locally: cargo deny check advisories bans licenses sources

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Dependencies: licences compatible with sacdfs's GPL-3.0-or-later (sacdfs itself is
# GPL-3.0-or-later).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-2-Clause", "BSD-3-Clause", "GPL-3.0-or-later", "LGPL-2.1-or-later", "GPL-2.0-or-later"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The engine, until it is published on crates.io.
allow-git = ["https://github.com/aclater/scarletbook-rs"]
