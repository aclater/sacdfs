# The core's tests on Windows and macOS (#419, #420): the library's unit tests, the Volume API
# every front end relies on (tests/vfs.rs), the corpus (tests/corpus.rs), and the `tags` and
# `verify` subcommands, which run without FUSE. The FUSE mount tests stay in ci.yml (Linux).
# The front ends' own jobs are in their workflows.
name: core-portable

on:
  pull_request:
    # Not a required check, so a path filter is fine: a pull request runs it only when code that differs
    # between platforms (or the front end itself) changes. Pushes to main, the nightly schedule and a release's own run are unfiltered.
    paths:
      - "src/platform/**"
      - "src/nfs/**"
      - "src/bin/**"
      - "src/lib.rs"
      - "src/main.rs"
      - "src/engine.rs"
      - "src/printable.rs"
      - "src/track.rs"
      - "src/tree.rs"
      - "src/verify/**"
      - "src/vfs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/common/**"
      - "tests/vfs.rs"
      - "tests/corpus.rs"
      - "tests/corpus/**"
      - ".github/workflows/core-portable.yml"
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"  # nightly: what a pull request skipped by path still runs here

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  test:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      # On macOS, the cache of sacdfs-nfs.yml's macOS jobs (same runners, a superset of the
      # build), read only; Windows keeps its own, written by main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: ${{ startsWith(matrix.os, 'macos') && 'macos' || 'core-portable' }}
          save-if: ${{ github.ref == 'refs/heads/main' && !startsWith(matrix.os, 'macos') }}
      - name: Tests
        run: cargo test --locked --no-fail-fast --lib --test vfs --test corpus --test tags --test verify
      - name: The binary's version
        run: test "$(cargo run --locked -q --bin sacdfs -- --version)" = "sacdfs $(cargo pkgid | sed 's/.*[@#]//')"
