# The release (#44). On a version tag (v0.1.0, ...; tags are immutable by ruleset): check
# that the tag matches Cargo.toml and has a CHANGELOG.md section, build and test the Linux
# binaries and the container image, then publish:
#   - a GitHub release with the notes from CHANGELOG.md and three Linux binaries (glibc 2.17+,
#     #244), sacdfs-<version>-x86_64-linux.tar.gz (generic x86-64),
#     sacdfs-<version>-x86_64-v3-linux.tar.gz (x86-64-v3: AVX2 CPUs) and
#     sacdfs-<version>-aarch64-linux.tar.gz, each with COPYING,
#     README.md, CHANGELOG.md, sacdfs-ctl, sacdfs.service, sacdfs.conf.example, install.sh and
#     nas-compose.yaml, a .sha256 checksum and a build provenance attestation;
#   - the installer, install.sh (#340), with this version as its default, also as an asset of
#     its own with a .sha256 checksum and an attestation, so that
#     releases/latest/download/install.sh is the newest release's;
#   - the container image, ghcr.io/aclater/sacdfs:<version> and :latest, a multi-arch manifest
#     (amd64 and arm64, #43), attested, after the container share test passed on each very image.
#   - the crate on crates.io (#155), for final versions only (no hyphen: not 0.4.0-rc.1),
#     through crates.io trusted publishing (no token stored here). A version already on
#     crates.io is skipped, so the first one, published by hand, doesn't fail the release.
#
# Dry run: run by hand (workflow_dispatch), or on a pull request that changes the release's
# files, it builds and tests everything and publishes nothing. Every job or step that
# publishes is guarded by `github.ref_type == 'tag'`, and only a tag push makes that true.
#
# The release checklist is in CONTRIBUTING.md, "Releasing".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "Containerfile"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

# One release per tag at a time; a second run for the same ref waits instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  IMAGE: ghcr.io/aclater/sacdfs

defaults:
  run:
    shell: bash

jobs:
  # Cheap checks first: a tag that doesn't match the version, or has no CHANGELOG.md section,
  # stops the release before anything is built.
  preflight:
    name: version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml's version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -I -c '
          import tomllib
          with open("Cargo.toml", "rb") as f:
              print(tomllib.load(f)["package"]["version"])')
          locked=$(python3 -I -c '
          import tomllib
          with open("Cargo.lock", "rb") as f:
              print(next(p["version"] for p in tomllib.load(f)["package"] if p["name"] == "sacdfs"))')
          if [[ "$locked" != "$version" ]]; then
            echo "::error::Cargo.lock has sacdfs $locked, Cargo.toml $version"
            exit 1
          fi
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ "$REF_NAME" != "v$version" ]]; then
              echo "::error::tag $REF_NAME does not match Cargo.toml's version $version (expected v$version)"
              exit 1
            fi
          else
            echo "::notice::dry run of sacdfs $version from $REF_NAME: nothing will be published"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dry=()
          [[ "$REF_TYPE" == tag ]] || dry=(--dry-run)
          python3 -I .github/scripts/changelog-notes.py CHANGELOG.md "$VERSION" "${dry[@]}" > notes.md
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 7
      # The installer (#340), its default version set to this release's: one-liner users get
      # the release it came with unless they pass --version.
      - name: The installer, stamped with this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p installer
          sed "s/^DEFAULT_VERSION=[^ ]*/DEFAULT_VERSION=$VERSION/" deploy/install.sh > installer/install.sh
          grep -q "^DEFAULT_VERSION=$VERSION " installer/install.sh
          sh -n installer/install.sh
          (cd installer && sha256sum install.sh > install.sh.sha256 && cat install.sh.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: installer
          path: installer/
          if-no-files-found: error
          retention-days: 7

  # Linux binaries linked against glibc 2.17's symbols (#244), so that they run on RHEL 7 era
  # systems and on NAS systems with an old glibc (QNAP's QuTScloud 5.2.9 has 2.21), with
  # glibc's malloc and the binary's speed unchanged. Built with cargo-zigbuild: zig links
  # against the symbol versions of the glibc named in the target (x86_64-unknown-linux-gnu.2.17),
  # whatever the build system's glibc. zig and cargo-zigbuild are pinned to exact versions,
  # the zig archive by its SHA-256. Rust's own std supports glibc 2.17 and later. Not static
  # musl: measured, musl's malloc made reads 1.25 to 2.6 times slower, and the faster
  # allocators cost speed on plain DSD discs (jemalloc) or 3.5 to 4.6 times the peak memory
  # (mimalloc) (docs/design.md, "Release binaries"). Rust comes from rustup, the toolchain the
  # rest of CI tests with. Each build is tested on its native runner (the whole test suite,
  # FUSE included, linked the same way), checked for its newest glibc symbol, then the
  # packaged binary is checked on the corpus on the runner and, on x86_64, in a UBI 7
  # container (RHEL 7's glibc 2.17, no fusermount: as root, sacdfs mounts directly), which
  # must serve the same bytes.
  binaries:
    name: binary (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # target-cpu is always set on x86_64, never left to a toolchain's default.
          - {name: x86_64, arch: x86_64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64",
             zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00}
          - {name: x86_64-v3, arch: x86_64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3",
             zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00}
          - {name: aarch64, arch: aarch64, runner: ubuntu-24.04-arm, rustflags: "",
             zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      NAME: ${{ matrix.name }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.arch }}-unknown-linux-gnu
      GLIBC_MAX: "2.17"
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: ${{ matrix.zig_sha256 }}
      CARGO_ZIGBUILD_VERSION: 0.24.0
      MATRIX_RUSTFLAGS: ${{ matrix.rustflags }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # registry.access.redhat.com/ubi7/ubi, pinned by digest: glibc 2.17 (x86_64 only).
      UBI7: registry.access.redhat.com/ubi7/ubi@sha256:046e525722f14702c360dc6092324af7c21656e76b0c254b067871f1d4d3df68
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The runner can run an x86-64-v3 build
        if: matrix.name == 'x86_64-v3'
        run: |
          # The v3 binary is published only if it passed its tests on this runner.
          for f in avx2 bmi1 bmi2 fma movbe; do
            grep -qw "$f" /proc/cpuinfo || { echo "::error::runner CPU has no $f: the x86-64-v3 build cannot be tested"; exit 1; }
          done
      - name: Rust, zig, cargo-zigbuild and fusermount3
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal --target "$TARGET"
          rustup default "$RUST_STABLE"
          zig="zig-$ARCH-linux-$ZIG_VERSION"
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/$zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
          # The runner's paths are left out of the binary.
          echo "RUSTFLAGS=$MATRIX_RUSTFLAGS --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/sacdfs" >> "$GITHUB_ENV"
      - name: Build and test, linked against glibc 2.17 (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          zig version
          cargo zigbuild --release --locked --bin sacdfs --target "$TARGET.$GLIBC_MAX"
          cargo-zigbuild test --release --locked --target "$TARGET.$GLIBC_MAX"
      - name: glibc 2.17 or later, stripped
        run: |
          bin="target/$TARGET/release/sacdfs"
          file "$bin"
          readelf -d "$bin" | grep NEEDED
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "newest glibc symbol version: $max"
          if [[ "$(printf '%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -n 1)" != "$GLIBC_MAX" ]]; then
            echo "::error::the binary needs glibc $max, newer than $GLIBC_MAX"; exit 1
          fi
          if readelf -S "$bin" | grep -q '\.symtab'; then
            echo "::error::the binary is not stripped"; exit 1
          fi
      - name: Package
        run: |
          pkg="sacdfs-$VERSION-$NAME-linux"
          mkdir -p "dist/$pkg"
          install -m 0755 "target/$TARGET/release/sacdfs" "dist/$pkg/sacdfs"
          install -m 0644 COPYING README.md CHANGELOG.md "dist/$pkg/"
          # The files for starting and stopping sacdfs on a NAS (#289): the script for systems
          # without systemd, the systemd unit and the settings file both read.
          install -m 0755 deploy/sacdfs-ctl "dist/$pkg/"
          install -m 0644 deploy/systemd/sacdfs.service deploy/sacdfs.conf.example "dist/$pkg/"
          # The installer (#340), stamped with this version, and the Compose file it uses.
          sed "s/^DEFAULT_VERSION=[^ ]*/DEFAULT_VERSION=$VERSION/" deploy/install.sh > "dist/$pkg/install.sh"
          chmod 0755 "dist/$pkg/install.sh"
          # The Compose file names this release's image, or the container route would run whatever
          # version main's copy names (0.6.2-rc.1 shipped one naming 0.6.1).
          sed "s#ghcr.io/aclater/sacdfs:[^ ]*\$#ghcr.io/aclater/sacdfs:$VERSION#" deploy/nas-compose.yaml > "dist/$pkg/nas-compose.yaml"
          grep -q "image: ghcr.io/aclater/sacdfs:$VERSION\$" "dist/$pkg/nas-compose.yaml"
          chmod 0644 "dist/$pkg/nas-compose.yaml"
          # Reproducible: fixed order, owner and times (the commit's), no gzip timestamp.
          mtime=$(git log -1 --format=%ct)
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$mtime" \
            -cf - "$pkg" | gzip -n -9 > "dist/$pkg.tar.gz"
          (cd dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256" && cat "$pkg.tar.gz.sha256")
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: The packaged binary serves the corpus
        run: |
          mkdir -p /tmp/check /tmp/mnt
          tar -C /tmp/check -xzf "dist/$PKG.tar.gz"
          bin="/tmp/check/$PKG/sacdfs"
          "$bin" --version
          "$bin" tests/corpus/images /tmp/mnt 2> /tmp/serve.log
          status=0
          python3 -I deploy/check-share.py tests/corpus/manifest.json /tmp/mnt --min 400 --wav || status=$?
          (cd /tmp/mnt && find . -type f | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /tmp/host.sha256
          fusermount3 -u /tmp/mnt
          exit $status
      - name: The same bytes on glibc 2.17, mounted without fusermount (UBI 7)
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            -v "/tmp/check/$PKG:/d:ro" -v "$PWD/tests/corpus/images:/images:ro" -v /tmp:/out \
            "$UBI7" bash -euc '
              rpm -q glibc
              ! command -v fusermount3 && ! command -v fusermount
              /d/sacdfs --version
              mkdir -p /mnt/s
              /d/sacdfs /images /mnt/s 2> /out/ubi7.log
              (cd /mnt/s && find . -type f | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /out/ubi7.sha256
              umount /mnt/s'
          wc -l /tmp/host.sha256 /tmp/ubi7.sha256
          cmp /tmp/host.sha256 /tmp/ubi7.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bin-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # The image is built and tested here without any write permission; publishing it (below,
  # on a tag) loads the very image tested.
  image:
    name: container image (${{ matrix.arch }})
    needs: preflight
    # Native runners for both architectures (#43): each image is tested where it runs.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # RUSTFLAGS is set explicitly (never a toolchain default); arm64 takes none.
          - {arch: amd64, runner: ubuntu-latest, rustflags: "-C target-cpu=x86-64"}
          - {arch: arm64, runner: ubuntu-24.04-arm, rustflags: ""}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ARCH: ${{ matrix.arch }}
      IMAGE_RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image (generic CPU)
        run: |
          docker build -f Containerfile \
            --build-arg RUSTFLAGS="$IMAGE_RUSTFLAGS" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t sacdfs:release .
      - name: Container share test on this image (deploy/ci-share-test.sh)
        run: deploy/ci-share-test.sh sacdfs:release
      - name: Server log
        if: always()
        run: docker logs sacdfs 2>&1 | grep -v ' INFO  sacdfs::' | tail -n 200 || true
      - name: Save the tested image
        run: docker save sacdfs:release | gzip > "sacdfs-image-$ARCH.tar.gz" && ls -l sacdfs-image-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: sacdfs-image-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # What a dry run would have published.
  dry-run:
    name: dry run summary
    if: github.ref_type != 'tag'
    needs: [preflight, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: installer
          path: dist
      - name: Summary
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          {
            echo "## Dry run: sacdfs $VERSION, nothing published"
            echo
            echo "Release assets that a tag would publish:"
            echo
            echo '```'
            (cd dist && ls -l && cat ./*.sha256)
            echo '```'
            echo
            echo "Image that a tag would push: \`$IMAGE:$VERSION\` and \`$IMAGE:latest\` (share test passed)."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing, on a tag only.
  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [preflight, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Build provenance attestations (Sigstore, through the workflow's OIDC token).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: installer
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum -c ./*.sha256
          cat ./*.tar.gz.sha256 install.sh.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        id: attest
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
      # The attestation also goes on the release as <asset>.intoto.jsonl (one bundle covers
      # both), so it can be checked offline; each copy is verified first.
      - name: Provenance bundles
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for f in dist/*.tar.gz dist/install.sh; do
            cp "$BUNDLE" "$f.intoto.jsonl"
            gh attestation verify "$f" --bundle "$f.intoto.jsonl" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          {
            cat notes.md
            echo
            echo "## Downloads"
            echo
            echo "Linux binaries, glibc 2.17 or later (RHEL 7 era and later), needing FUSE and, as a user other than root, FUSE 3's \`fusermount3\` (package fuse3) or FUSE 2's \`fusermount\`; root needs neither:"
            echo
            echo "- \`sacdfs-$VERSION-x86_64-linux.tar.gz\`: generic x86-64, for any x86_64 CPU."
            echo "- \`sacdfs-$VERSION-x86_64-v3-linux.tar.gz\`: x86-64-v3 (AVX2, most Intel and AMD CPUs since about 2015): about 20 % less CPU for WAV files. It stops with an illegal-instruction error on older CPUs."
            echo "- \`sacdfs-$VERSION-aarch64-linux.tar.gz\`: aarch64 (64-bit ARM)."
            echo
            echo "Container image for a NAS (SMB and NFS): \`$IMAGE:$VERSION\` (generic CPU; amd64 and arm64)."
            echo
            echo "Installer: \`install.sh\` finds the system and sets sacdfs up (docs/install/README.md): \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sudo sh -s -- --iso-dir /path/to/images\`."
            echo
            echo "Verify a download: \`sha256sum -c <asset>.sha256\` and \`gh attestation verify <asset> -R $GITHUB_REPOSITORY\`; the image: \`gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY\`. See the README, \"Install\"."
            echo
            echo "Built from $GITHUB_SHA."
          } > release-notes.md
          pre=()
          [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "${pre[@]}" \
            --title "sacdfs $VERSION" --notes-file release-notes.md \
            dist/*.tar.gz dist/*.sha256 dist/*.intoto.jsonl dist/SHA256SUMS dist/install.sh

  image-publish:
    name: publish image
    if: github.ref_type == 'tag'
    needs: [preflight, image, release]
    runs-on: ubuntu-latest
    permissions:
      # Pushing to ghcr.io, and the attestation pushed next to the image.
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-*
      - name: Push both images and the multi-arch manifest
        id: push
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Each architecture's tested image is pushed under <version>-<arch>, then
          # <version> (and :latest) become a manifest list of the two.
          for arch in amd64 arm64; do
            docker load < "image-$arch/sacdfs-image-$arch.tar.gz"
            docker tag sacdfs:release "$IMAGE:$VERSION-$arch"
            docker push "$IMAGE:$VERSION-$arch"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION-$arch")
            echo "digest_$arch=${digest#*@}" >> "$GITHUB_OUTPUT"
            docker rmi sacdfs:release
          done
          tags=("$IMAGE:$VERSION")
          # A pre-release (0.2.0-rc.1) doesn't move :latest.
          [[ "$VERSION" == *-* ]] || tags+=("$IMAGE:latest")
          for t in "${tags[@]}"; do
            docker buildx imagetools create -t "$t" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pushed ${tags[*]} ($digest)"
      - name: Attest build provenance (manifest list)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance (amd64 image)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest_amd64 }}
          push-to-registry: true
      - name: Attest build provenance (arm64 image)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest_arm64 }}
          push-to-registry: true
      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  # crates.io (#155), after the GitHub release, on final versions only: a version on
  # crates.io can never be deleted or reused, only yanked, and release candidates are
  # tested from the GitHub release and the image, not from crates.io.
  # Trusted publishing: crates-io-auth-action trades this job's OIDC token for a crates.io
  # token valid for 30 minutes; crates.io accepts it only from this repository's
  # release.yml, as configured in the crate's settings there. Trusted publishing cannot
  # create a crate, so the owner publishes the first version (0.4.0) by hand
  # (CONTRIBUTING.md, "Releasing"); this job then finds that version on crates.io and only
  # logs it.
  crates-publish:
    name: publish to crates.io
    if: github.ref_type == 'tag' && !contains(needs.preflight.outputs.version, '-')
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Checking out the tagged sources.
      contents: read
      # The OIDC token crates-io-auth-action exchanges for a crates.io token.
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Is this version on crates.io already?
        id: check
        run: |
          ua="sacdfs release workflow (https://github.com/$GITHUB_REPOSITORY)"
          crate=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/sacdfs)
          if [[ "$crate" == 404 ]]; then
            echo "::error::sacdfs is not on crates.io yet. Trusted publishing cannot create a crate: publish $VERSION by hand from this tag (CONTRIBUTING.md, \"Releasing\"), set up the trusted publisher, then re-run this job"
            exit 1
          elif [[ "$crate" != 200 ]]; then
            echo "::error::crates.io API returned HTTP $crate for the crate"
            exit 1
          fi
          code=$(curl -sS -A "$ua" -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/sacdfs/$VERSION")
          if [[ "$code" == 200 ]]; then
            echo "::notice::sacdfs $VERSION is already on crates.io (published by hand); nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$code" == 404 ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io API returned HTTP $code for sacdfs $VERSION"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.check.outputs.publish == 'true'
        with:
          persist-credentials: false
      - name: Rust toolchain
        if: steps.check.outputs.publish == 'true'
        run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Authenticate with crates.io (trusted publishing)
        if: steps.check.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: cargo publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
