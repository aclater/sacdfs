version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sacdfs_web_1
      APP_PORT: 8080

  # A static page with the addresses of the shares (sacdfs itself has no web interface).
  web:
    image: registry.access.redhat.com/ubi10/nginx-126:1794217835@sha256:903aca1f9fa61c438f3629b35e5e66bbeac25e370608c9875cf996123dfb62e1
    restart: on-failure
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ${APP_DATA_DIR}/data/www:/opt/app-root/src:ro

  server:
    image: ghcr.io/aclater/sacdfs:0.6.4@sha256:2039b43f413feafed41504f6c91170538bb18c3f40f01971b21a2d01e4609192
    restart: on-failure
    stop_grace_period: 30s
    # sacdfs is a FUSE filesystem: it needs the FUSE device and SYS_ADMIN to mount it inside
    # the container. All other capabilities are dropped; the entry point gives each program
    # only its own share of these seven (sacdfs: SYS_ADMIN, DAC_OVERRIDE; smbd: SETUID,
    # SETGID, NET_BIND_SERVICE; NFS-Ganesha: DAC_READ_SEARCH; SETPCAP to drop the rest).
    devices:
      - /dev/fuse
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SETPCAP
    security_opt:
      - no-new-privileges:true
      # Docker's default AppArmor profile forbids mount(2) even with SYS_ADMIN.
      - apparmor=unconfined
    environment:
      SMB_USER: umbrel
      SMB_PASSWORD: ${APP_PASSWORD}
      SACDFS_FORMATS: dsf,wav
      SACDFS_FLATTEN: "0"
      NFS_CLIENTS: "*"
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads:/images:ro
      - ${APP_DATA_DIR}/data/cache:/cache
    ports:
      # SMB and NFS on other ports than 445 and 2049, which umbrelOS's own file sharing holds.
      - "10445:445"
      - "12049:2049"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
