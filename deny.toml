# cargo-deny: licences, advisories, bans and sources of every dependency.
# Locally: cargo deny check advisories bans licenses sources

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only: sacdfs is MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "BSD-2-Clause", "BSD-3-Clause"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The engine, until it is published on crates.io.
allow-git = ["https://github.com/aclater/scarletbook-rs"]
