# The NAS container image (Containerfile): build it, serve the corpus, and read it back over
# SMB and NFS from a client container with kernel mounts, checking every track's hashes
# against the corpus manifest. See docs/deployment.md.
name: container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    name: container (SMB, NFS, ${{ matrix.arch }})
    # arm64 on GitHub's native arm64 runners, not emulation: the image is built and the share
    # test is run on the architecture it is for (#43).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -f Containerfile -t sacdfs:ci .

      # The share test is a script so that the release (release.yml) runs the same test on
      # the image it publishes.
      - name: Serve the corpus and read it over SMB and NFS (deploy/ci-share-test.sh)
        run: deploy/ci-share-test.sh sacdfs:ci

      - name: Server log
        if: always()
        run: docker logs sacdfs 2>&1 | grep -v ' INFO  sacdfs::' | tail -n 200 || true
