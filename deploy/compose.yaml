#
# sacdfs on a NAS or any Linux host, with Docker Compose or Podman Compose (rootful):
#
#   SACD_IMAGES=/path/to/images docker compose -f deploy/compose.yaml up -d --build
#
# See docs/deployment.md for every setting and for client mounts.
services:
  sacdfs:
    build:
      context: ..
      dockerfile: Containerfile
    image: localhost/sacdfs:latest
    container_name: sacdfs
    # hostname: sacdfs   # keeps the SMB server identity across a recreate (docs/deployment.md#smb-and-restarts)
    restart: unless-stopped
    # Least privilege (docs/deployment.md, "Capabilities"): none of the runtime's default set,
    # only these. The entry point then gives each program only its own share of them:
    #   SYS_ADMIN        sacdfs, to mount FUSE (with the device below)
    #   DAC_OVERRIDE     sacdfs, to read the images whatever their owner; useradd for SMB_USER
    #   DAC_READ_SEARCH  NFS-Ganesha (open_by_handle_at); with NFS: "0" nothing keeps it
    #   SETUID, SETGID   smbd, to act as the connecting user or guest
    #   NET_BIND_SERVICE smbd, for port 445
    #   SETPCAP          the entry point, to take from each program what it does not need
    devices:
      - /dev/fuse
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SETPCAP
    security_opt:
      # No program can gain privileges through a setuid file (FUSE does not need it: sacdfs
      # mounts as root in the container, without the setuid fusermount3).
      - no-new-privileges:true
      # Docker's default AppArmor profile forbids mount(2), even with CAP_SYS_ADMIN, on
      # hosts that use AppArmor (Ubuntu, Debian, TrueNAS SCALE). Not needed under SELinux.
      - apparmor=unconfined
    ports:
      - "445:445"
      - "2049:2049"
    volumes:
      - ${SACD_IMAGES:?set SACD_IMAGES to the directory of your images}:/images:ro
      - sacdfs-cache:/cache
    environment:
      SACDFS_FORMATS: dsf,wav
      # SACDFS_CACHE_MB: "32"         # default: 32, or 16 under a memory limit up to 512 MiB
      # SACDFS_LISTING_MB: "64"       # default: no bound, or 3/8 of the memory limit
      SACDFS_FLATTEN: "0"
      # SACDFS_TAGS: /tags              # user tags (#81); add a volume, e.g. ./tags:/tags:ro
      # SACDFS_MUSICBRAINZ: "1"         # look up discs without text (#185); the tags volume must be rw
      # SACDFS_MC_ALBUM_SUFFIX: "0"   # no " (Multichannel)" on the multichannel files' album tag
      # SACDFS_PCM_RATE: "176400"
      # SACDFS_PCM_CUTOFF: "40"
      # SACDFS_PCM_GAIN: "0"
      # SACDFS_SIDECARS: default   # folder art, scans and playlists passed through
      # SMB_USER: music
      # SMB_PASSWORD_FILE: /run/secrets/smb_password
      # NFS_CLIENTS: 192.0.2.0/24
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    stop_grace_period: 30s

volumes:
  sacdfs-cache:
