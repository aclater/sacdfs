{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.sacdfs_container_name, "image") %}

{# FUSE needs /dev/fuse. Capabilities: the library drops ALL and sets no-new-privileges; these are added back, and
   the entry point gives each program only its own share (docs/deployment.md, "Capabilities"):
   SYS_ADMIN (sacdfs mounts), DAC_OVERRIDE (sacdfs reads the images whatever their owner; useradd for an SMB user),
   DAC_READ_SEARCH (NFS-Ganesha: open_by_handle_at), SETUID and SETGID (smbd acts as the connecting user or guest),
   NET_BIND_SERVICE (smbd: port 445), SETPCAP (the entry point drops what each program does not need). #}
{% do c1.devices.add_device("/dev/fuse", "/dev/fuse", allow_disallowed=True) %}
{% do c1.add_caps(["SYS_ADMIN", "DAC_OVERRIDE", "DAC_READ_SEARCH", "SETUID", "SETGID", "NET_BIND_SERVICE", "SETPCAP"]) %}
{# Docker's default AppArmor profile forbids mount(2) even with CAP_SYS_ADMIN. #}
{% do c1.add_security_opt("apparmor", "unconfined") %}
{% do c1.set_grace_period(20) %}

{% do c1.healthcheck.set_custom_test(["CMD", values.consts.healthcheck_script]) %}
{% do c1.healthcheck.set_start_period(300) %}
{% do c1.healthcheck.set_interval(30) %}
{% do c1.healthcheck.set_timeout(10) %}
{% do c1.healthcheck.set_retries(3) %}

{% do c1.environment.add_env("SACDFS_FORMATS", values.sacdfs.formats) %}
{% do c1.environment.add_env("SACDFS_FLATTEN", "1" if values.sacdfs.flatten else "0") %}
{% if values.sacdfs.smb_user %}
  {% do c1.environment.add_env("SMB_USER", values.sacdfs.smb_user) %}
  {% do c1.environment.add_env("SMB_PASSWORD", values.sacdfs.smb_password) %}
{% endif %}
{% if values.sacdfs.nfs_clients %}
  {% do c1.environment.add_env("NFS_CLIENTS", values.sacdfs.nfs_clients) %}
{% endif %}
{% do c1.environment.add_user_envs(values.sacdfs.additional_envs) %}

{% do c1.add_port(values.network.smb_port, {"container_port": values.consts.smb_container_port}) %}
{% do c1.add_port(values.network.nfs_port, {"container_port": values.consts.nfs_container_port}) %}

{# The images are always read-only, whatever the form says. #}
{% set images_storage = {"type": "host_path", "read_only": true, "host_path_config": values.storage.images.host_path_config} %}
{% do c1.add_storage(values.consts.images_path, images_storage) %}

{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": 0, "gid": 0, "mode": "check"} %}
{% do c1.add_storage(values.consts.cache_path, values.storage.cache) %}
{% do perm_container.add_or_skip_action("cache", values.storage.cache, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{{ tpl.render() | tojson }}
