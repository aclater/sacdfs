# CI: formatting, clippy, the tests (including the FUSE tests that mount the corpus), and a
# check that the options table (docs/options.md) matches `sacdfs --help`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  # Docs-only pull requests skip the build and test jobs (changes.yml); skipped, they report success.
  changes:
    uses: $/.github/workflows/changes.yml

  lint:
    name: fmt + clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      # Fedora 44, pinned by digest: UBI has no ShellCheck.
      image: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc shadow-utils util-linux ShellCheck systemd python3 && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE" rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-fedora44
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path winfsp/Cargo.toml --check
      - name: ShellCheck on every shell script, each in the dialect it declares
        run: git ls-files -z '*.sh' deploy/sacdfs-ctl | xargs -0 shellcheck
      # ruff, pinned by version and hash (.github/requirements/ruff.txt), at its default rules
      # with the settings in ruff.toml.
      - name: ruff on the Python scripts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install -q --require-hashes -r .github/requirements/ruff.txt
          "$RUNNER_TEMP/ruff/bin/ruff" check --output-format=github
      - name: NAS service file (deploy/systemd/sacdfs.service)
        run: |
          sed 's|/usr/local/bin/sacdfs|/bin/true|' deploy/systemd/sacdfs.service > /tmp/sacdfs.service
          systemd-analyze verify /tmp/sacdfs.service
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest. See .github/scripts/ci-container-setup.sh. FUSE: the device and the right to mount.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc fuse3 python3 rsync && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - run: ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      # A guard's test reports as passed, so the skips are counted and compared (#207).
      - name: Only the expected tests skipped
        run: |
          python3 -I scripts/test_check_skips.py
          python3 -I scripts/test_soak.py
          python3 -I scripts/test_trace_replay.py
          python3 -I scripts/test_stall_gate.py
          python3 -I scripts/test_bench_compare.py
          python3 -I scripts/check_skips.py --job tests "$RUNNER_TEMP/test-output.txt"
      - name: Converter benchmark (smoke test, each case once)
        run: cargo bench --locked --bench pcm -- --test

  # The same tests on aarch64 (#43), on a native arm64 runner.
  test-arm64:
    name: tests (arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04-arm
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest. See .github/scripts/ci-container-setup.sh. FUSE: the device and the right to mount.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
      options: --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc fuse3 python3 rsync && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - run: ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
      - name: Only the expected tests skipped
        run: python3 -I scripts/check_skips.py --job tests-arm64 "$RUNNER_TEMP/test-output.txt"

  # The same tests on 32-bit x86 (#488), built as the release builds it: static
  # i686-unknown-linux-musl, Pentium 4 (SSE2 at most), linked by zig through cargo-zigbuild, at
  # the versions release.yml pins. The x86_64 runner runs the 32-bit binaries natively.
  test-i686:
    name: tests (i686)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    env:
      TARGET: i686-unknown-linux-musl
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      CARGO_ZIGBUILD_VERSION: 0.24.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal --target "$TARGET"
          rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
      # The release binary of the pinned version, checked against the SHA-256 in the action's
      # manifest, in place of a build from source (about 40 s).
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b  # v2.90.1
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
          fallback: none
      - name: zig and fusermount3
        run: |
          zig="zig-x86_64-linux-$ZIG_VERSION"
          curl -sSfL --proto =https --tlsv1.2 -o "$RUNNER_TEMP/$zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/$zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$zig.tar.xz" | sha256sum -c
          tar -C "$RUNNER_TEMP" -xJf "$RUNNER_TEMP/$zig.tar.xz"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
          # Here, not for the job: only the test build is for the old CPU.
          RUSTFLAGS: -C target-cpu=pentium4 -C target-feature=+crt-static
        run: |
          set -o pipefail
          cargo-zigbuild test --locked --target "$TARGET" 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          file "target/$TARGET/debug/sacdfs" | tee /dev/stderr | grep -q 'ELF 32-bit.*Intel.*statically linked'
      - name: Only the expected tests skipped
        run: python3 -I scripts/check_skips.py --job tests-i686 "$RUNNER_TEMP/test-output.txt"

  readme-options:
    name: readme options
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest. See .github/scripts/ci-container-setup.sh.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    defaults:
      run:
        shell: runuser -u ci -- bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Packages
        shell: bash
        run: dnf -y -q --setopt=install_weak_deps=False install git-core gcc python3 groff-base && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rust and the build user (.github/scripts/ci-container-setup.sh)
        shell: bash
        run: .github/scripts/ci-container-setup.sh "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}  # PRs read main's cache, only main writes it
          prefix-key: v0-rust-ubi10
      - name: The restored cache to the build user
        shell: bash
        run: chown -R ci "$GITHUB_WORKSPACE" "$HOME"
      - run: cargo build --locked --quiet
      - name: The options table (docs/options.md) matches sacdfs --help
        run: target/debug/sacdfs --help | python3 -I .github/scripts/check-readme-options.py docs/options.md
      - name: The manual pages (man/) are current and list the options of docs/options.md
        run: |
          cargo build --locked --quiet --features man,nfs
          python3 -I .github/scripts/check-man.py target/debug/sacdfs man docs/options.md

  private-names:
    # Commit identities and tracked files must carry no private details (home.arpa names,
    # private addresses in identities, and the PRIVATE_NAMES repository variable, a regex kept
    # outside the repository). See scripts/check-private-names.sh.
    name: no private names
    runs-on: ubuntu-latest
    container:
      # UBI 10 (ubi10/ubi 10.3), pinned by digest.
      image: registry.access.redhat.com/ubi10/ubi@sha256:1e9193f051ac70582821c8a941325c5053488c54c75cd0c31b577d871ac29dba
    steps:
      - name: Packages
        run: dnf -y -q --setopt=install_weak_deps=False install git-core findutils gawk && dnf clean all
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan files and commit identities
        shell: bash
        env:
          PRIVATE_NAMES: ${{ vars.PRIVATE_NAMES }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/check-private-names.sh
      - name: Equal copies and container hardening (.github/scripts/check-copies.sh)
        run: sh .github/scripts/check-copies.sh
