resources:
  limits:
    cpus: 2.0
    memory: 2048

TZ: Etc/UTC

sacdfs:
  formats: dsf,wav
  flatten: false
  smb_user: ""
  smb_password: ""
  nfs_clients: ""
  additional_envs: []

network:
  smb_port:
    bind_mode: published
    port_number: 10445
  nfs_port:
    bind_mode: published
    port_number: 12049

ix_volumes:
  cache: /opt/tests/mnt/sacdfs/cache

storage:
  images:
    type: host_path
    host_path_config:
      path: /opt/tests/mnt/sacdfs/images
  cache:
    type: ix_volume
    ix_volume_config:
      dataset_name: cache
      create_host_path: true
  additional_storage: []
