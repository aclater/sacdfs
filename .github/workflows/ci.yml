# CI: formatting, clippy, and the tests, including the FUSE tests that mount the corpus.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy && rustup default "$RUST_STABLE"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Install fusermount3
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fuse3
          ls -l /dev/fuse
      - name: Tests (FUSE tests required)
        env:
          SACDFS_FUSE_TESTS: "1"
        run: cargo test --locked
      - name: Converter tests on each instruction set's code (#23; v4 only where the runner has AVX-512)
        run: |
          grep -o -w -E 'avx512f|avx2' /proc/cpuinfo | sort -u || true
          for s in baseline v3 v4; do
            SACDFS_SIMD=$s cargo test --locked --lib --test pcm --test wav
          done
      - name: Converter benchmark (smoke test, each case once)
        run: cargo bench --locked --bench pcm -- --test
